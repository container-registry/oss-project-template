version: '3'

# The single entry point for every check and build. CI calls `task <name>`
# rather than duplicating commands, so a green local run means a green CI run.
# Tool versions come from versions.env.

# Multi-line scripts stop at the first failing command instead of running on
# and reporting the exit code of whatever happened to come last.
set: [errexit, pipefail]

dotenv: ['versions.env']

# The Helm chart pack. Delete this block with the pack.
includes:
  helm:
    taskfile: taskfile/helm.yml
    dir: .

vars:
  # The only definition of the platform set; publish-image.yml reads it back
  # rather than keeping a copy that could drift from what ships.
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  RELEASE_BINARY: '{{.RELEASE_BINARY | default "app"}}'
  RELEASE_DIST: '{{.RELEASE_DIST | default "dist"}}'
  RELEASE_PACKAGE: '{{.RELEASE_PACKAGE | default "."}}'

tasks:
  default:
    cmds: [task --list]

  bootstrap:
    desc: Turn the template into a project (prompts, or pass flags - see --help)
    interactive: true
    cmds:
      - python3 .github/scripts/bootstrap.py {{.CLI_ARGS}}

  check:
    # Deliberately not `image` or `vuln-check`: both need the network or a
    # container runtime and belong in CI, not in a pre-push hook.
    desc: Run the fast CI gates (everything except the image build and vuln scan)
    cmds:
      - task: spellcheck
      - task: lint:yaml
      - task: lint:actions
      - task: lint:pins
      - task: lint:repo
      - task: commit-lint
      - task: dco-check
      - task: build
      - task: lint
      - task: test
      - task: tidy-check
      - task: license-check

  # --- Language-neutral gates ---------------------------------------------

  spellcheck:
    desc: Spell check (mirrors the hygiene workflow)
    cmds:
      - typos --config .typos.toml

  lint:yaml:
    desc: Lint every YAML file
    cmds:
      - yamllint --strict .

  lint:actions:
    desc: Lint the GitHub Actions workflows
    cmds:
      - actionlint -color

  lint:repo:
    desc: Check repository consistency (dangling references, label and release config drift)
    cmds:
      - python3 .github/scripts/repo-lint.py

  lint:pins:
    desc: Check every action is pinned to a full SHA with a version comment
    cmds:
      - |
        failed=0
        while IFS= read -r file; do
          while IFS= read -r line || [ -n "$line" ]; do
            printf '%s' "$line" | grep -qE '^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]' || continue
            ref=$(printf '%s' "$line" | sed 's/.*uses:[[:space:]]*//' | awk '{print $1}')
            case "$ref" in ./*) continue ;; esac
            case "$ref" in
              docker://*)
                printf '%s' "$ref" | grep -qE '@sha256:[a-f0-9]{64}$' || { echo "UNPINNED CONTAINER: $file -> $ref"; failed=1; }
                continue ;;
            esac
            printf '%s' "$line" | grep -qE '@[a-f0-9]{40}[[:space:]]+#[[:space:]]*v[0-9]' || { echo "UNPINNED: $file -> $ref"; failed=1; }
          done < "$file"
        done < <(find .github/workflows .github/actions -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null)
        [ "$failed" -eq 0 ] || exit 1
        echo "All actions are pinned."

  commit-lint:
    desc: Check commits follow Conventional Commits (BASE=<ref> to change the base)
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - |
        base='{{.BASE}}'
        # No fallback to a fixed window: five checked, "all commits" reported.
        if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
          echo "ERROR: base ref '${base}' not found. Fetch it, or run with BASE=<ref>."
          exit 1
        fi
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"
        for commit in $(git log --format=%H "${base}..HEAD"); do
          msg=$(git log -1 --format=%s "$commit")
          if ! echo "$msg" | grep -Eq "$pattern"; then
            echo "ERROR: Commit $commit does not follow Conventional Commits"
            echo "  Message: $msg"
            echo "  Format: <type>[scope]: <description>"
            exit 1
          fi
        done
        echo "All commits follow Conventional Commits format"

  dco-check:
    desc: Check commits carry a DCO sign-off (BASE=<ref> to change the base)
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      # --no-merges matches the DCO workflow and the dco2 app, both of which
      # exempt merge commits. The bot exemption they also share has no local
      # equivalent: it needs the API to tell a real bot account from a git
      # user.name ending in [bot].
      - |
        base='{{.BASE}}'
        # No fallback to a fixed window: five checked, "all commits" reported.
        if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
          echo "ERROR: base ref '${base}' not found. Fetch it, or run with BASE=<ref>."
          exit 1
        fi
        for commit in $(git log --no-merges --format=%H "${base}..HEAD"); do
          # Same extraction and regex as dco.yml and lefthook.yml; keep in sync.
          trailers=$(git log -1 --format=%B "$commit" | awk '/^[[:space:]]*$/ {blank=1; next} {if (blank) {block=""; blank=0} block = block $0 "\n"} END {printf "%s", block}')
          if ! printf '%s' "$trailers" | grep -qE "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$"; then
            echo "ERROR: Commit $commit missing DCO sign-off"
            echo "Fix with: git commit --amend -s"
            exit 1
          fi
        done
        echo "All commits have DCO sign-off"

  # --- Go pack -------------------------------------------------------------
  # Every task below is skipped when there is no go.mod, so the Taskfile keeps
  # working after the Go pack is deleted. Replace them for another language.

  build:
    desc: Build the project
    status: ['! test -f go.mod']
    cmds:
      # -o bin/ matters: a bare `go build ./...` drops a binary per main
      # package into the repository root, where `git add -A` picks it up.
      - go build -trimpath -o bin/ ./...

  test:
    desc: Run tests with the race detector
    status: ['! test -f go.mod']
    env:
      # -race needs cgo. Some runner images export CGO_ENABLED=0, and the race
      # detector then quietly does not run.
      CGO_ENABLED: '1'
    cmds:
      - go test -race -coverprofile=coverage.out -covermode=atomic ./...

  lint:
    desc: Run the Go linter
    status: ['! test -f go.mod']
    cmds:
      # `go run <module>@<version>` rather than requiring a preinstalled
      # binary: the version comes from versions.env, so a local run and a CI
      # run use the same linter and neither has to install anything first.
      - go run "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCILINT_VERSION}" run

  tidy-check:
    desc: Fail if go.mod or go.sum is not tidy
    status: ['! test -f go.mod']
    cmds:
      - go mod tidy
      - git diff --exit-code -- go.mod go.sum

  image:
    desc: Build the container image locally
    status: ['! test -f Dockerfile']
    cmds:
      - >-
        docker build
        --build-arg VERSION="$(cat version.txt)"
        -t "{{.RELEASE_BINARY}}:$(cat version.txt)" .

  image:platforms:
    desc: Print the platform list the image build and image:verify share
    # Nothing but the list, so a workflow can capture it into GITHUB_OUTPUT.
    silent: true
    env:
      # Via env, not templated: an override with shell metacharacters would run.
      PLATFORMS: '{{.IMAGE_PLATFORMS}}'
    cmds:
      - printf '%s\n' "${PLATFORMS}"

  image:verify:
    desc: Verify a pushed image index carries exactly IMAGE_PLATFORMS (IMAGE_REF=name@sha256:... or name:tag)
    status: ['! test -f Dockerfile']
    requires:
      vars: [IMAGE_REF]
    vars:
      PLATFORMS: '{{.PLATFORMS | default .IMAGE_PLATFORMS}}'
    env:
      # Reached through the environment rather than templated into the script,
      # so a value containing shell metacharacters cannot alter the command.
      IMAGE_REF: '{{.IMAGE_REF}}'
      PLATFORMS: '{{.PLATFORMS}}'
    preconditions:
      - sh: docker buildx version >/dev/null 2>&1
        msg: docker buildx is required to inspect a published image index
      - sh: command -v jq >/dev/null 2>&1
        msg: jq is required to inspect a published image index
    cmds:
      # The index buildx reports after a push is what it sent, not what the
      # registry serves. This reads the index back and fails on a missing,
      # unexpected or duplicated platform, so a half-pushed release cannot
      # be signed and announced as multi-arch.
      - cmd: |
          set -euo pipefail
          reference="${IMAGE_REF}"
          # containerd's platform normalisation, which buildx applies to
          # --platform before it writes the index: aarch64 and x86_64 are
          # aliases, a bare arm means arm/v7, and arm64/v8 is arm64. Applied to
          # both sides, so an index entry that inherited a variant from its base
          # image, or an alias the build was legitimately asked for, still
          # matches.
          normalize() {
            sed -E \
              -e 's#^linux/(aarch64|arm64)#linux/arm64#' \
              -e 's#^linux/(x86_64|x86-64|amd64)#linux/amd64#' \
              -e 's#^linux/i386$#linux/386#' \
              -e 's#^linux/armhf$#linux/arm/v7#' \
              -e 's#^linux/armel$#linux/arm/v6#' \
              -e 's#^linux/arm64/v?8$#linux/arm64#' \
              -e 's#^linux/arm$#linux/arm/v7#' \
              -e 's#^linux/arm/([5-8])$#linux/arm/v\1#'
          }
          # grep exits 1 on an all-empty list, which errexit would turn into a
          # silent abort before the guard below can say what is wrong.
          expected=$(printf '%s' "${PLATFORMS}" | tr ',' '\n' | tr -d '[:blank:]' | grep -v '^$' | normalize | sort -u || true)
          if [ -z "${expected}" ]; then
            echo "No expected platforms given (PLATFORMS/IMAGE_PLATFORMS is empty)" >&2
            exit 1
          fi

          if ! raw=$(docker buildx imagetools inspect --raw "${reference}" 2>&1); then
            echo "Cannot inspect ${reference}: ${raw}" >&2
            exit 1
          fi

          if ! media_type=$(printf '%s' "${raw}" | jq -r '.mediaType // ""' 2>/dev/null); then
            echo "Manifest of ${reference} is not valid JSON" >&2
            exit 1
          fi
          if [ "${media_type}" != "application/vnd.oci.image.index.v1+json" ]; then
            echo "Not a multi-arch OCI image index: ${reference} (mediaType: ${media_type:-none})" >&2
            exit 1
          fi

          # Keyed like a buildx platform string, os/arch with the variant when
          # there is one, so linux/arm/v6 and linux/arm/v7 are two platforms.
          # buildx records provenance and SBOM attestations as unknown/unknown
          # entries of the index; they are attachments, not platforms.
          # Filter the fields, not the joined key, or an attestation carrying a
          # variant slips through; "" counts as true and "/" + 7 aborts jq.
          actual=$(printf '%s' "${raw}" \
            | jq -r '
                .manifests[]? | .platform // {}
                | select((.os | type) == "string" and .os != ""
                         and (.architecture | type) == "string" and .architecture != "")
                | select(.os != "unknown" or .architecture != "unknown")
                | "\(.os)/\(.architecture)"
                  + (if (.variant | type) == "string" and .variant != ""
                     then "/" + .variant else "" end)' \
            | normalize | sort)
          if [ -z "${actual}" ]; then
            echo "No platform manifests in ${reference}" >&2
            exit 1
          fi

          failed=0
          for platform in ${expected}; do
            printf '%s\n' "${actual}" | grep -Fqx "${platform}" || {
              echo "Missing ${platform} manifest in ${reference}" >&2
              failed=1
            }
          done
          for platform in ${actual}; do
            printf '%s\n' "${expected}" | grep -Fqx "${platform}" || {
              echo "Unexpected ${platform} manifest in ${reference}" >&2
              failed=1
            }
          done
          duplicates=$(printf '%s\n' "${actual}" | uniq -d)
          if [ -n "${duplicates}" ]; then
            echo "Duplicate platform manifests in ${reference}: $(printf '%s' "${duplicates}" | tr '\n' ' ')" >&2
            failed=1
          fi
          [ "${failed}" -eq 0 ] || exit 1

          echo "Verified ${reference}: $(printf '%s' "${actual}" | tr '\n' ' ')"
        silent: true

  vuln-check:
    desc: Check dependencies for known vulnerabilities (fails on any finding; CI uses vuln-report)
    status: ['! test -f go.mod']
    cmds:
      - go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  vuln-report:
    desc: Scan with govulncheck and render markdown reports into VULN_DIR (what CI runs)
    status: ['! test -f go.mod']
    vars:
      VULN_DIR: '{{.VULN_DIR | default "vulnerability-check"}}'
    cmds:
      - mkdir -p "{{.VULN_DIR}}"
      # Findings are a result, not a failure, so the exit code is captured
      # rather than propagated; `vuln-report:check` turns a scan that could
      # not produce a usable report into a job failure.
      - |
        set +e
        go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" -format json ./... \
          > "{{.VULN_DIR}}/govulncheck.json" 2> "{{.VULN_DIR}}/govulncheck.stderr"
        echo $? > "{{.VULN_DIR}}/govulncheck.exit"
      - task: vuln-report:render
        vars: {VULN_DIR: '{{.VULN_DIR}}', MODE: full, NAME: report}
      # The pull request comment lists only what a reviewer can act on. It must
      # not duplicate the full report in the job summary or its counts.
      - task: vuln-report:render
        vars:
          VULN_DIR: '{{.VULN_DIR}}'
          MODE: fixable
          NAME: comment
          EXTRA_FLAGS: "-step-summary=false -github-output=false"
      - cmd: echo "Reports written to {{.VULN_DIR}}/ (report.md, comment.md, report-summary.json)"
        silent: true

  vuln-report:render:
    internal: true
    vars:
      MAX_ROWS: '{{.MAX_ROWS | default "50"}}'
    cmd: >-
      go run ./tools/govulncheck-report
      -json "{{.VULN_DIR}}/govulncheck.json"
      -stderr "{{.VULN_DIR}}/govulncheck.stderr"
      -exit-file "{{.VULN_DIR}}/govulncheck.exit"
      -mode {{.MODE}}
      -max-rows {{.MAX_ROWS}}
      -out "{{.VULN_DIR}}/{{.NAME}}.md"
      -summary "{{.VULN_DIR}}/{{.NAME}}-summary.json"
      {{.EXTRA_FLAGS}}

  vuln-report:check:
    desc: Fail if the last vuln-report run could not produce a usable govulncheck report
    status: ['! test -f go.mod']
    vars:
      VULN_DIR: '{{.VULN_DIR | default "vulnerability-check"}}'
    cmd: >-
      go run ./tools/govulncheck-report
      -json "{{.VULN_DIR}}/govulncheck.json"
      -stderr "{{.VULN_DIR}}/govulncheck.stderr"
      -exit-file "{{.VULN_DIR}}/govulncheck.exit"
      -out /dev/null -step-summary=false -github-output=false
      -fail-on-scanner-error

  license-check:
    desc: Check dependency licences against the policy
    status: ['! test -f go.mod']
    cmds:
      # forbidden and restricted are the copyleft classes that would change the
      # licence of what we ship. unknown is rejected because a licence we could
      # not classify is not one we can vouch for.
      #
      # `reciprocal` is deliberately absent: it covers MPL-2.0, EPL and CDDL,
      # which are file-level copyleft and safe to depend on. Including it fails
      # on the first hashicorp dependency, and the adopter deletes the gate.
      # `permissive` is absent too and should stay that way - upstream defines
      # it as an empty set, so listing it only looks like policy.
      - go run "github.com/google/go-licenses/v2@${GOLICENSES_VERSION}" check ./... --disallowed_types=forbidden,restricted,unknown --ignore="$(go list -m)"

  license-report:
    desc: Write a dependency licence report to the CI job summary
    status: ['! test -f go.mod']
    cmds:
      - |
        go run "github.com/google/go-licenses/v2@${GOLICENSES_VERSION}" report ./... --ignore="$(go list -m)" > licenses.csv 2>/dev/null || true
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## Dependency licences"
            echo '```'
            head -100 licenses.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          cat licenses.csv
        fi

  release-assets:
    desc: Build the release binaries into dist/
    status: ['! test -f go.mod']
    cmds:
      - mkdir -p "{{.RELEASE_DIST}}"
      - task: _release-asset
        vars: {GOOS: linux, GOARCH: amd64}
      - task: _release-asset
        vars: {GOOS: linux, GOARCH: arm64}
      - task: _release-asset
        vars: {GOOS: darwin, GOARCH: amd64}
      - task: _release-asset
        vars: {GOOS: darwin, GOARCH: arm64}
      - task: _release-asset
        vars: {GOOS: windows, GOARCH: amd64, EXT: .exe}
      - task: release-checksums

  release-checksums:
    desc: Checksum everything in dist/ (run again after adding files such as an SBOM)
    dir: '{{.RELEASE_DIST}}'
    cmds:
      - |
        # Written to a temporary file and moved into place: redirecting
        # straight to checksums.txt creates it before the glob is expanded, so
        # the file ends up containing the checksum of its own empty self.
        # A dotfile, so `./*` does not match it, then moved into place.
        # Redirecting straight to checksums.txt creates the file before the
        # glob is expanded, and it ends up checksumming its own empty self.
        rm -f checksums.txt
        if command -v sha256sum >/dev/null 2>&1; then
          sha256sum ./* > .checksums.tmp
        else
          shasum -a 256 ./* > .checksums.tmp
        fi
        mv .checksums.tmp checksums.txt

  _release-asset:
    internal: true
    requires:
      vars: [GOOS, GOARCH]
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: '0'
    # -trimpath and the version stamp keep the build reproducible and make the
    # binary able to report which release it came from.
    cmd: >-
      go build -trimpath
      -ldflags="-s -w -X main.version=$(cat version.txt)"
      -o "{{.RELEASE_DIST}}/{{.RELEASE_BINARY}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}}"
      "{{.RELEASE_PACKAGE}}"

  # --- Setup ---------------------------------------------------------------

  setup:
    desc: Install the pinned tools and the git hooks
    deps: [install-tools]
    cmds:
      - lefthook install

  install-tools:
    desc: Install the CLI tools the checks need, at the pinned versions
    cmds:
      - command -v typos >/dev/null || brew install typos-cli || cargo install typos-cli
      - command -v lefthook >/dev/null || brew install lefthook || go install github.com/evilmartians/lefthook@latest
      - command -v yamllint >/dev/null || pip install "yamllint==${YAMLLINT_VERSION}"
      # repo-lint parses YAML; yamllint pulls PyYAML in, but not necessarily
      # into the interpreter `python3` resolves to.
      - python3 -c 'import yaml' 2>/dev/null || pip install pyyaml
      - command -v actionlint >/dev/null || brew install actionlint || go install github.com/rhysd/actionlint/cmd/actionlint@v${ACTIONLINT_VERSION}
      # The Go tools are not installed: `task lint`, `task license-check` and
      # `task vuln-check` fetch them at the pinned version with `go run`.

  clean:
    desc: Remove build output
    cmds:
      - rm -rf dist bin coverage.out licenses.csv vulnerability-check

  info:
    desc: Show the pinned tool versions
    cmds:
      - |
        echo "task           $(task --version 2>/dev/null || echo -)"
        echo "TASK_VERSION   ${TASK_VERSION}"
        echo "TYPOS          ${TYPOS_VERSION}"
        echo "ACTIONLINT     ${ACTIONLINT_VERSION}"
        echo "YAMLLINT       ${YAMLLINT_VERSION}"
        echo "GOLANGCILINT   ${GOLANGCILINT_VERSION:--}"
        echo "GOVULNCHECK    ${GOVULNCHECK_VERSION:--}"
