version: '3'

vars:
  RELEASE_BINARY: '{{.RELEASE_BINARY | default "app"}}'
  RELEASE_DIST: '{{.RELEASE_DIST | default "dist"}}'
  RELEASE_PACKAGE: '{{.RELEASE_PACKAGE | default "."}}'

tasks:
  default:
    cmds: [task --list]

  check:
    desc: Run all pre-commit checks
    cmds:
      - task: spellcheck
      - task: commit-lint
      - task: dco-check
      - task: license-check

  spellcheck:
    desc: Run spell checker (mirrors CI)
    cmds:
      - typos --config .typos.toml

  commit-lint:
    desc: Check commits follow Conventional Commits format
    cmds:
      - |
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          msg=$(git log -1 --format=%s $commit)
          if ! echo "$msg" | grep -Eq "$pattern"; then
            echo "ERROR: Commit $commit does not follow Conventional Commits"
            echo "  Message: $msg"
            echo "  Format: <type>[scope]: <description>"
            exit 1
          fi
        done
        echo "All commits follow Conventional Commits format"

  dco-check:
    desc: Check commits have DCO sign-off
    cmds:
      - |
        for commit in $(git log --format=%H origin/main..HEAD 2>/dev/null || git log --format=%H -5); do
          if ! git log -1 --format=%B $commit | grep -q "^Signed-off-by:"; then
            echo "ERROR: Commit $commit missing DCO sign-off"
            echo "Fix with: git commit --amend -s"
            exit 1
          fi
        done
        echo "All commits have DCO sign-off"

  license-check:
    desc: Check Go dependency licenses (mirrors CI)
    cmds:
      - go-licenses check ./... --disallowed_types=forbidden,restricted,reciprocal,permissive,unknown --ignore=$(go list -m)
    status:
      - '! test -f go.mod'

  release-assets:
    desc: Build the example Go release binaries into dist/
    cmds:
      - mkdir -p "{{.RELEASE_DIST}}"
      - task: _release-asset
        vars: {GOOS: linux, GOARCH: amd64}
      - task: _release-asset
        vars: {GOOS: darwin, GOARCH: amd64}
      - task: _release-asset
        vars: {GOOS: darwin, GOARCH: arm64}
      - task: _release-asset
        vars: {GOOS: windows, GOARCH: amd64, EXT: .exe}

  _release-asset:
    internal: true
    requires:
      vars: [GOOS, GOARCH]
    env:
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
      CGO_ENABLED: '0'
    cmd: go build -trimpath -o "{{.RELEASE_DIST}}/{{.RELEASE_BINARY}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}}" "{{.RELEASE_PACKAGE}}"

  setup:
    desc: Install tools and git hooks
    deps: [install-tools]
    cmds:
      - lefthook install

  install-tools:
    desc: Install required CLI tools
    cmds:
      - echo "Installing typos..." && brew install typos-cli || cargo install typos-cli
      - command -v lefthook || brew install lefthook || go install github.com/evilmartians/lefthook@latest
      - test -f go.mod && go install github.com/google/go-licenses@latest || true
