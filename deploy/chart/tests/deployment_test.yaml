---
suite: deployment
release:
  name: t
templates:
  - deployment.yaml
tests:
  - it: defaults the image tag to the chart appVersion
    chart:
      appVersion: v9.9.9
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/container-registry/oss-project-template:v9.9.9

  - it: prefers an explicit tag over appVersion
    set:
      image.tag: v1.2.3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/container-registry/oss-project-template:v1.2.3

  - it: runs under the restricted pod security standard by default
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          content: ALL

  - it: sets resources from values
    set:
      resources.limits.memory: 256Mi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 50m

  - it: carries the standard labels and the selector matches the pod
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: oss-project-template
      - equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: t
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: oss-project-template
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: t

  - it: adds commonLabels to the resource but not to the selector
    set:
      commonLabels:
        team: platform
    asserts:
      - equal:
          path: metadata.labels.team
          value: platform
      - isNull:
          path: spec.selector.matchLabels.team

  - it: omits the probes when disabled
    set:
      livenessProbe.enabled: false
      readinessProbe.enabled: false
    asserts:
      - isNull:
          path: spec.template.spec.containers[0].livenessProbe
      - isNull:
          path: spec.template.spec.containers[0].readinessProbe

  - it: passes extraEnv through
    set:
      extraEnv:
        - name: LOG_LEVEL
          value: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LOG_LEVEL
            value: debug

  - it: uses the default service account when creation is off
    set:
      serviceAccount.create: false
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: default
