---
suite: serviceaccount
release:
  name: t
templates:
  - serviceaccount.yaml
tests:
  - it: creates a ServiceAccount named after the release by default
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: t-oss-project-template
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: uses serviceAccount.name and annotations when given
    set:
      serviceAccount.name: custom
      serviceAccount.annotations:
        iam.example.com/role: reader
    asserts:
      - equal:
          path: metadata.name
          value: custom
      - equal:
          path: metadata.annotations["iam.example.com/role"]
          value: reader

  - it: renders nothing when creation is off
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
