name: Question
description: Ask how to do something
labels: ["question", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Questions are welcome here. Search the existing issues first - someone may have asked already.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The outcome you want, not the error you hit on the way.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Commands, configuration, and what happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0
    validations:
      required: false
