# Repository Settings
#
# YAML tree maps to GitHub API paths (base: /repos/{owner}/{repo}):
#   repository                   -> PATCH /repos/{owner}/{repo}
#   labels.{name}                -> PUT /repos/{owner}/{repo}/labels/{name}
#   branches.{name}.protection   -> PUT /repos/{owner}/{repo}/branches/{name}/protection
#   security                     -> PATCH /repos/{owner}/{repo} (security_and_analysis)
#   code_scanning                -> PATCH /repos/{owner}/{repo}/code-scanning/default-setup
#   actions                      -> PUT /repos/{owner}/{repo}/actions/permissions/workflow
#   rulesets.{name}              -> POST/PUT /repos/{owner}/{repo}/rulesets
#   environments.{name}          -> PUT /repos/{owner}/{repo}/environments/{name}
#
# Reference: https://docs.github.com/en/rest/repos

repository:
  # Everything here is PATCHed onto the repository on the first push to main.
  # Two keys are deliberately absent and must stay absent:
  #   visibility  - a private repository created from this template would
  #                 publish itself, which cannot be undone.
  #   is_template - every repository created from the template would itself
  #                 become a template.
  # Leave description and topics empty rather than inheriting the template's.
  description: ""
  homepage: ""
  topics: []
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  # One support surface, deliberately. Discussions is a second inbox, and an
  # unanswered discussion reads worse than not offering one. Questions go
  # through .github/ISSUE_TEMPLATE/question.yml instead. To switch: set this
  # true, restore the Discussions contact link in ISSUE_TEMPLATE/config.yml,
  # and delete question.yml.
  has_discussions: false
  default_branch: main
  allow_forking: true
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  allow_auto_merge: false
  allow_update_branch: true
  squash_merge_commit_title: PR_TITLE
  # COMMIT_MESSAGES, not PR_BODY. Under squash-only merging the pull request
  # body becomes the commit body, and a pull request body carries no
  # Signed-off-by trailer - so main ends up with zero DCO sign-offs while the
  # README claims every commit has one. This carries the branch trailers over.
  squash_merge_commit_message: COMMIT_MESSAGES
  merge_commit_title: MERGE_MESSAGE
  merge_commit_message: PR_TITLE
  web_commit_signoff_required: false

# Required for release-please to open and maintain its release pull request.
actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: true

