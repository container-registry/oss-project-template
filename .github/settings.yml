    description: Test-related changes
  build:
    color: c2e0c6
    description: Build system changes

security:
  # Secret scanning and push protection are free on public repositories and
  # this is the organisation default for new ones. Push protection is the one
  # that matters: it blocks the commit rather than reporting it afterwards.
  # On a private repository both require GitHub Advanced Security.
  secret_scanning:
    status: enabled
  secret_scanning_push_protection:
    status: enabled
  # Alerts are the precondition for security updates; declaring the updates
  # without the alerts silently does nothing.
  vulnerability_alerts: enabled
  dependabot_security_updates:
    status: enabled
  # Makes the "report a vulnerability" button real. SECURITY.md and the issue
  # template chooser both link to the advisory form, which errors without this.
  private_vulnerability_reporting: enabled

code_scanning:
  # Set to `configured` to turn on CodeQL default setup. The template instead
  # ships .github/workflows/codeql.yml, which is the advanced setup; running
  # both duplicates every alert.
  state: not-configured
  query_suite: default  # default, extended
  languages: [actions, go]

rulesets:
  # Shipped active. A project that does not want it deletes this block, which
  # is a decision someone makes on purpose rather than one nobody ever gets to.
  # Bypass nobody: a rule an admin routinely walks around is not a rule.
  protect-default-branch:
    target: branch
    enforcement: active
    bypass_actors: []
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward  # blocks force pushes
      - type: pull_request
        parameters:
          # Zero, not one. The rule that matters is that everything goes
          # through a pull request with green checks; requiring an approval a
          # solo maintainer cannot give themselves is how this whole block
          # ends up deleted. Raise it to 1 as soon as there are two
          # maintainers who can review each other.
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: false
          required_review_thread_resolution: false
          allowed_merge_methods: [squash]
      # No required_status_checks, deliberately. GitHub raises no workflow
      # events for a ref pushed with GITHUB_TOKEN, so the `chore: release`
      # pull request that release-please opens gets zero runs - and any
      # required context then blocks it forever. Verified on this repository:
      # the release pull request had no workflow runs at all.
      #
      # Two prerequisites before uncommenting the block below:
      #   1. release-please must open its pull request with a GitHub App token
      #      (actions/create-github-app-token) rather than GITHUB_TOKEN.
      #   2. Only require the aggregate `required-checks` context. A
      #      path-filtered workflow never reports on a pull request that misses
      #      its filter, and the check sits at "Expected" forever.
      #
      # - type: required_status_checks
      #   parameters:
      #     strict_required_status_checks_policy: true
      #     do_not_enforce_on_create: false
      #     required_status_checks:
      #       - context: required-checks
      #       - context: DCO

