# Repository settings managed by Probot Settings app
# https://probot.github.io/apps/settings/

repository:
  # See https://docs.github.com/en/rest/repos/repos#update-a-repository
  name: oss-project-template
  description: GitHub repository configuration and automation templates for open source projects.
  homepage: {{HOMEPAGE_URL}}
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: main
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Labels
labels:
  # Issue Types
  - name: bug
    color: "d73a4a"
    description: "Something isn't working"
  - name: enhancement
    color: "a2eeef"
    description: "New feature or request"
  - name: documentation
    color: "0075ca"
    description: "Improvements or additions to documentation"
  - name: proposal
    color: "fbca04"
    description: "Architectural proposal requiring discussion"
  - name: question
    color: "d876e3"
    description: "Further information is requested"

  # Triage
  - name: needs-triage
    color: "ededed"
    description: "Needs initial triage by maintainers"
  - name: needs-info
    color: "ffffff"
    description: "Additional information needed"
  - name: help wanted
    color: "008672"
    description: "Extra attention is needed"
  - name: good first issue
    color: "7057ff"
    description: "Good for newcomers"
  - name: mentor-available
    color: "0e8a16"
    description: "A mentor is available to help with this issue"

  # PR Size Labels
  - name: size/XS
    color: "3CBF00"
    description: "Extra small PR (< 10 lines)"
  - name: size/S
    color: "5D9801"
    description: "Small PR (10-100 lines)"
  - name: size/M
    color: "7F7203"
    description: "Medium PR (100-500 lines)"
  - name: size/L
    color: "A14C05"
    description: "Large PR (500-1000 lines)"
  - name: size/XL
    color: "C32607"
    description: "Extra large PR (> 1000 lines)"

  # Status
  - name: do-not-merge
    color: "e11d21"
    description: "PR should not be merged"
  - name: needs-rebase
    color: "e11d21"
    description: "PR needs to be rebased"
  - name: blocked
    color: "e11d21"
    description: "Blocked by another issue or PR"
  - name: wip
    color: "fef2c0"
    description: "Work in progress"

  # Categories
  - name: breaking-change
    color: "b60205"
    description: "Breaking change requiring major version bump"
  - name: security
    color: "d93f0b"
    description: "Security-related issue or fix"
  - name: dependencies
    color: "0366d6"
    description: "Dependencies update"

  # Components (customize for your project)
  - name: component/ci
    color: "c5def5"
    description: "CI/CD related"
  - name: component/docs
    color: "c5def5"
    description: "Documentation related"

