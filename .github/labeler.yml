# Configuration for actions/labeler
# Maps file patterns to labels

# Documentation changes
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'

# CI/CD changes
component/ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'
          - 'Taskfile.yml'
          - 'taskfile/**'
          - 'lefthook.yml'

# Dependencies
component/chart:
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/chart/**'
          - 'taskfile/helm.yml'
          - 'taskfile/ct-lintconf.yaml'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - 'go.mod'
          - 'go.sum'
          - 'package.json'
          - 'package-lock.json'
          - 'requirements.txt'
          - 'Cargo.toml'
          - 'Cargo.lock'

# Configuration changes.
# Deliberately narrow: globbing '*.yml' at the root matches Taskfile.yml, lefthook.yml and every
# workflow, so the label landed on nearly every pull request and stopped meaning anything.
component/config:
  - changed-files:
      - any-glob-to-any-file:
          - 'config/**'
          - 'configs/**'
          - '.editorconfig'
          - '.typos.toml'
          - '.yamllint'
          - 'versions.env'

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*_test.go'
          - '**/*.test.js'
          - '**/*.test.ts'
          - '**/*.spec.js'
          - '**/*.spec.ts'
          - 'tests/**/*'

# Add your project-specific labels below
# Example:
#
# component/api:
#   - changed-files:
#       - any-glob-to-any-file:
#           - 'src/api/**/*'
#
