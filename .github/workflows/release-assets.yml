---
name: Release Assets

# Called by release-please.yml once a release exists. It is not triggered by
# `release: published`, because a release created with GITHUB_TOKEN does not
# fire workflow events - that is why the previous version never ran.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to upload assets to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing GitHub Release tag to upload assets to
        required: true
        type: string

permissions: {}

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # Build provenance is signed with a short-lived OIDC identity, so there
      # is no key to store or rotate.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Build commands live in Taskfile.yml so they can be run locally.
      - name: Build release assets
        run: task release-assets

      # An SBOM for the release artifacts, not only for the container image.
      # Binaries are what most consumers actually download, and a bill of
      # materials that only covers the image does not describe them.
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/app-*

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: dist/*
