---
name: Apply Repository Settings

# What: Applies .github/settings.yml to the repository and reports drift.
# Fires on: push to main touching settings, a weekly drift check, or manual dispatch.
# Needs: SETTINGS_TOKEN, a fine-grained PAT with Administration read/write. Without it the job reports what it skipped and succeeds.
# Safe to delete if: repository settings are managed by hand. Delete .github/settings.yml and the script with it.
on:
  push:
    branches: [main]
    paths:
      - '.github/settings.yml'
      - '.github/scripts/apply-settings.js'
  schedule:
    - cron: '0 9 * * 1'  # Weekly Monday 9am UTC - drift check
  workflow_dispatch:
    inputs:
      mode:
        description: |
          verify - Apply settings then verify they were applied correctly (default)
          apply  - Apply settings.yml to GitHub without verification
          check  - Detect drift: compare settings.yml vs GitHub, fail if different (default on schedule)
        type: choice
        options: [verify, apply, check]
        default: verify

# GITHUB_TOKEN can manage labels but nothing else here: repository settings,
# security toggles and rulesets all need administration access.
#
# For the rest, add a SETTINGS_TOKEN secret holding a fine-grained personal
# access token scoped to this repository alone, with
#   Administration: read and write
#   Metadata: read
#   Issues: read and write        (labels are managed through the Issues API)
# A classic `repo`-scope token also works but grants far more than is needed.
#
# Without the secret the job reports what it skipped and succeeds; a brand new
# repository should not greet its owner with a red run it cannot fix.

permissions: {}

concurrency:
  group: apply-settings-${{ github.ref }}
  cancel-in-progress: false

env:
  # The secrets context cannot be used in a job-level `if`, so availability is
  # resolved once here and tested per step.
  HAS_SETTINGS_TOKEN: ${{ secrets.SETTINGS_TOKEN != '' }}

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Labels are managed through the Issues API.
      issues: write
    # Applying settings to a fork would rewrite somebody else's repository.
    if: ${{ !github.event.repository.fork }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # settings.yml is converted to JSON here so the script below needs no
      # YAML parser. That keeps a third-party dependency out of the one job
      # that can hold an administration token. PyYAML ships on GitHub's Ubuntu
      # runners; the install is a fallback, not the normal path.
      - name: Convert settings.yml to JSON
        if: env.HAS_SETTINGS_TOKEN == 'true'
        run: |
          set -euo pipefail
          # No install fallback here, deliberately. This is the one job that
          # can hold an administration token, and an unpinned PyPI install
          # would execute third-party code in the workspace before the step
          # that uses that token - including code able to rewrite
          # apply-settings.js. PyYAML ships on GitHub's Ubuntu runners; a
          # runner without it should fail loudly rather than fetch one.
          python3 -c 'import yaml' 2>/dev/null || {
            echo "::error::PyYAML is required and was not found. Install it on the runner image; this job will not fetch it." >&2
            exit 1
          }
          python3 -c '
          import json, yaml
          with open(".github/settings.yml") as handle:
              json.dump(yaml.safe_load(handle), open("settings.json", "w"))
          '

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        if: env.HAS_SETTINGS_TOKEN == 'true'
        env:
          # schedule has no inputs, so a cron run is a drift check; everything else applies and verifies.
          INPUT_MODE: ${{ inputs.mode || (github.event_name == 'schedule' && 'check' || 'verify') }}
          SETTINGS_JSON: settings.json
        with:
          github-token: ${{ secrets.SETTINGS_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const script = require('./.github/scripts/apply-settings.js')
            await script({ github, context, core })

      - name: Explain what was skipped
        if: env.HAS_SETTINGS_TOKEN != 'true'
        run: |
          {
            echo "## Repository settings not applied"
            echo
            echo "\`SETTINGS_TOKEN\` is not configured, so \`.github/settings.yml\` was not applied."
            echo "GITHUB_TOKEN cannot change repository settings, security toggles or rulesets."
            echo
            echo "Add a fine-grained personal access token scoped to this repository with"
            echo "**Administration: read and write** and **Metadata: read**, store it as the"
            echo "\`SETTINGS_TOKEN\` secret, then re-run this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
