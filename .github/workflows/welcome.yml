name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions: {}

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d  # v3.1.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue! 🎉

            A maintainer will review this soon. In the meantime:
            - Check our [documentation]({{DOCS_URL}}) for common solutions
            - Search [existing issues](https://github.com/${{ github.repository }}/issues) for similar reports

            If this is a question rather than a bug report, consider posting in [GitHub Discussions](https://github.com/${{ github.repository }}/discussions) instead.

          pr-message: |
            Thanks for your first pull request! 🎉

            A maintainer will review this soon. Please ensure:
            - [ ] Tests pass locally
            - [ ] Code follows our style guidelines
            - [ ] Commits are signed off (DCO)
            - [ ] PR title follows [Conventional Commits](https://www.conventionalcommits.org/)

            Check out our [Contributing Guide](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md) for more details.
