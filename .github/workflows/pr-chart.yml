---
name: PR Preview Chart

# What: Packages, pushes and signs a preview of the Helm chart for a pull request, versioned X.Y.Z-pr.<N>, and comments the reference on it.
# Fires on: pull requests against main whose cumulative diff touches a chart input; in a native GitHub stack, only the top pull request.
# Needs: nothing for the ttl.sh default. A real registry needs CHART_REPOSITORY plus the CHART_REGISTRY_* secrets, as for publish-chart.yml.
# Safe to delete if: the project ships no chart. `task bootstrap --chart=none` removes the whole pack.
#
# Self-contained on purpose: publish-chart.yml only accepts a published
# chart-vX.Y.Z release tag, and a preview must not weaken that check.
#
# The chart-input allowlist lives in the `changes` job, not in the trigger's
# `paths` filter. GitHub evaluates `paths` against a pull request's own diff,
# which for a stacked pull request is only its top slice. The job diffs
# against the stack base instead, so the workflow always reports a status.

on:
  pull_request:
    # `stacked`: GitHub opens the PRs of a stack before it links them, so
    # `opened` never carries `pull_request.stack`; the link fires `stacked`.
    types: [opened, synchronize, reopened, stacked]
    branches: [main]

permissions: {}

concurrency:
  group: pr-chart-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # `secrets` cannot be used in a step-level `if`; an env value can.
  HAS_REGISTRY_CREDENTIALS: ${{ secrets.CHART_REGISTRY_PASSWORD != '' }}
  HAS_REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME != '' }}

jobs:
  changes:
    name: Check chart inputs
    # A fork gets no secrets and no OIDC token, dependabot a read-only token.
    # A chart release pull request only restamps version, changelog and
    # README, so its preview would be main's chart under another version. In
    # a native GitHub stack only the top pull request publishes: its head
    # already contains every lower one.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--') &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      matched: ${{ steps.diff.outputs.matched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the diff below spans the whole stack
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the stack base
        id: diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || '' }}
          STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
          EVENT_ACTION: ${{ github.event.action }}
          # Only inputs that reach the packaged chart.
          CHART_INPUTS: |
            ^deploy/chart/
            ^\.github/workflows/pr-chart\.yml$
            ^\.github/scripts/chart-annotate-images\.sh$
        run: |
          set -euo pipefail
          echo "event=${EVENT_ACTION} stack=${STACK_NUMBER:-none}"
          if [ ! -f deploy/chart/Chart.yaml ]; then
            echo "No chart. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${STACK_BASE_SHA:-${PR_BASE_SHA}}"
          # --no-renames: a rename out of the allowlist would otherwise show
          # only its new path and hide that a chart input went away
          changed="$(git diff --name-only --no-renames "${base}...${HEAD_SHA}")"
          if matched="$(grep -Ef <(printf '%s' "${CHART_INPUTS}") <<<"${changed}")"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # Named in the pull request comment, so a pull request that
            # changes no chart input itself can see why its stack still
            # produces one.
            {
              echo "matched<<MATCHED_EOF"
              printf '%s\n' "${matched}"
              echo "MATCHED_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No chart input changed between ${base} and ${HEAD_SHA}. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  preview-chart:
    name: Publish preview chart
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Keyless signing: a short-lived OIDC identity instead of a signing key.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_version: ${{ steps.version.outputs.app_version }}
      chart_ref: ${{ steps.destination.outputs.chart_ref }}
      registry_host: ${{ steps.destination.outputs.registry_host }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The head, not the merge commit: the same ref the image preview builds.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Load version pins
        run: |
          grep -E '^[A-Z_0-9]+=' versions.env >> "$GITHUB_ENV"
          {
            echo "HELM_CACHE_HOME=${RUNNER_TEMP}/helm/cache"
            echo "HELM_CONFIG_HOME=${RUNNER_TEMP}/helm/config"
            echo "HELM_DATA_HOME=${RUNNER_TEMP}/helm/data"
          } >> "$GITHUB_ENV"

      - name: Resolve and validate the destination
        id: destination
        # Same rules as publish-chart.yml: the configured repository or the
        # ttl.sh default, host checked against the allowlist because
        # credentials and a signature must not go to a mistyped host.
        env:
          CONFIGURED: ${{ vars.CHART_REPOSITORY }}
          DEFAULT: ttl.sh/${{ github.repository }}/charts
          ALLOWLIST: ${{ vars.CHART_REGISTRY_ALLOWLIST }}
        run: |
          set -euo pipefail
          if [ "${HAS_REGISTRY_USERNAME}" != "${HAS_REGISTRY_CREDENTIALS}" ]; then
            echo "::error::CHART_REGISTRY_USERNAME and CHART_REGISTRY_PASSWORD must be set together; only one of them is."
            exit 1
          fi
          repository="$(echo "${CONFIGURED:-$DEFAULT}" | tr '[:upper:]' '[:lower:]')"
          host="${repository%%/*}"
          allowed="${ALLOWLIST:-${host}}"
          ok=false
          for h in ${allowed//,/ }; do
            [ "${host}" = "${h}" ] && ok=true
          done
          if [ "${ok}" != true ]; then
            echo "::error::'${repository}' is on host '${host}', which is not in CHART_REGISTRY_ALLOWLIST (${allowed})."
            exit 1
          fi
          name="$(awk '/^name:/ {print $2; exit}' deploy/chart/Chart.yaml)"
          if [[ ! "${name}" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
            echo "::error::Chart.yaml name '${name}' is not a valid OCI repository segment"
            exit 1
          fi
          {
            echo "CHART_NAME=${name}"
            echo "CHART_REPOSITORY=${repository}"
            echo "REGISTRY_HOST=${host}"
            echo "CHART_REF=${repository}/${name}"
          } >> "$GITHUB_ENV"
          {
            echo "chart_ref=${repository}/${name}"
            echo "registry_host=${host}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve the preview version
        id: version
        # <chart version>-pr.<N>: a semver prerelease, so helm accepts it as an
        # exact --version and the OCI tag is the version string itself. It is
        # overwritten on every push; the comment carries the digest for pinning.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          read_key() {
            awk -F'[:[:space:]]+' -v key="$1" '$1 == key { gsub(/["'"'"']/, "", $2); print $2; exit }' deploy/chart/Chart.yaml
          }
          version="$(read_key version)"
          app_version="$(read_key appVersion)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unusable chart version in deploy/chart/Chart.yaml: '${version}'"
            exit 1
          fi
          preview="${version}-pr.${PR_NUMBER}"
          echo "PREVIEW_VERSION=${preview}" >> "$GITHUB_ENV"
          {
            echo "version=${preview}"
            echo "app_version=${app_version}"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      # cosign reads the docker config; helm keeps its own registry config,
      # so a real registry needs both logins. ttl.sh takes neither.
      - name: Log in to the registry (docker config, for cosign)
        if: env.HAS_REGISTRY_CREDENTIALS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.CHART_REGISTRY_USERNAME }}
          password: ${{ secrets.CHART_REGISTRY_PASSWORD }}

      - name: Log in to the registry (helm)
        if: env.HAS_REGISTRY_CREDENTIALS == 'true'
        env:
          USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
          PASSWORD: ${{ secrets.CHART_REGISTRY_PASSWORD }}
        run: helm registry login "${REGISTRY_HOST}" --username "${USERNAME}" --password-stdin <<< "${PASSWORD}"

      - name: Add the per-release Artifact Hub images annotation
        # Same packaging as a release, so the preview is what the release will be.
        run: .github/scripts/chart-annotate-images.sh deploy/chart

      - name: Package the chart
        # appVersion is left as committed, so the default image tag is an app
        # release that already exists.
        run: helm package deploy/chart --version "${PREVIEW_VERSION}" --destination dist

      - name: Push the chart
        id: push
        # pipefail: the default shell is `bash -e` without it, so a failing
        # helm push would be masked by tee, and its error text can itself
        # contain a sha256 the capture below would match.
        run: |
          set -euo pipefail
          helm push "dist/${CHART_NAME}-${PREVIEW_VERSION}.tgz" "oci://${CHART_REPOSITORY}" 2>&1 | tee push.log
          digest=$(grep -o 'sha256:[a-f0-9]\{64\}' push.log | head -1)
          if [ -z "${digest}" ]; then
            echo "::error::Could not capture the chart digest from the helm push output"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # By digest, never by tag: the preview version is repointed on every push.
      - name: Sign the chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${CHART_REF}@${DIGEST}"

  pr-comment:
    name: Comment preview chart ref
    needs: [changes, preview-chart]
    # Also runs when nothing was published: a build that is skipped, fails, or
    # belongs to a PR that is not the top of its stack leaves an earlier
    # reference standing, and the comment has to say that it is stale.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      CHART_REF: ${{ needs.preview-chart.outputs.chart_ref }}
      REGISTRY_HOST: ${{ needs.preview-chart.outputs.registry_host }}
      PREVIEW_VERSION: ${{ needs.preview-chart.outputs.version }}
      APP_VERSION: ${{ needs.preview-chart.outputs.app_version }}
      DIGEST: ${{ needs.preview-chart.outputs.digest }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
      MATCHED: ${{ needs.changes.outputs.matched }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      BUILD_RESULT: ${{ needs.preview-chart.result }}
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          MARKER: "<!-- pr-preview-chart -->"
          SIBLING_MARKER: "<!-- pr-preview-image -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const siblingMarker = process.env.SIBLING_MARKER;
            const staleStart = '<!-- preview:stale-start -->';
            const staleEnd = '<!-- preview:stale-end -->';
            const stackNumber = process.env.STACK_NUMBER;
            const short = process.env.HEAD_SHA.slice(0, 7);
            const repository = process.env.GITHUB_REPOSITORY;
            const issueNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const { CHART_REF, REGISTRY_HOST, PREVIEW_VERSION, APP_VERSION, DIGEST } = process.env;
            const chartName = (CHART_REF || '').split('/').pop();
            const ref = `${CHART_REF}@${DIGEST}`;
            const identity = `^https://github\\.com/${owner}/${repo}/\\.github/workflows/pr-chart\\.yml@`;
            const ttl = REGISTRY_HOST === 'ttl.sh'
              ? ['', 'ttl.sh is an ephemeral registry: this artifact is gone within 24 hours.']
              : [];

            const stack = stackNumber
              ? await github.request('GET /repos/{owner}/{repo}/stacks/{stack_number}', {
                  owner, repo, stack_number: Number(stackNumber),
                }).then(response => response.data).catch(error => {
                  core.warning(`Could not list stack #${stackNumber}: ${error.message}`);
                  return null;
                })
              : null;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));

            const post = async body => {
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            };

            // The notice is delimited rather than pattern-matched, so a second
            // one replaces the first instead of stacking under it.
            const withoutNotice = body => {
              const kept = [];
              let inNotice = false;
              for (const line of body.split('\n')) {
                if (line === staleStart) { inNotice = true; continue; }
                if (line === staleEnd) { inNotice = false; continue; }
                if (!inNotice && line !== marker) kept.push(line);
              }
              return kept.join('\n').trim();
            };

            if (process.env.BUILD_RESULT !== 'success') {
              // Nothing was published, so there is nothing to correct unless an
              // earlier revision left a reference behind.
              if (!existing) return;
              let reason;
              if (process.env.CHANGES_RESULT === 'skipped' && stackNumber) {
                const top = stack?.pull_requests?.[stack.pull_requests.length - 1];
                reason = `this PR is not the top of stack #${stackNumber}` +
                  (top ? `, so the stack's preview chart is published on #${top.number}` : '');
              } else if (process.env.CHANGES_RESULT !== 'success') {
                // A failed or cancelled input check publishes nothing either,
                // and must not be reported as "no input changed".
                reason = `the chart input check for \`${short}\` did not complete (${process.env.CHANGES_RESULT})`;
              } else if (process.env.BUILD_RESULT === 'skipped') {
                reason = `no chart input changed between the base and \`${short}\``;
              } else {
                reason = `the preview chart build for \`${short}\` did not succeed (${process.env.BUILD_RESULT})`;
              }
              await post([
                marker,
                staleStart,
                '> [!WARNING]',
                `> **Outdated:** ${reason}. What follows is from an earlier revision of this PR.`,
                staleEnd,
                '',
                withoutNotice(existing.body),
              ].join('\n'));
              return;
            }

            const matched = (process.env.MATCHED || '').split('\n').map(line => line.trim()).filter(Boolean);
            const shown = matched.slice(0, 5).map(path => `\`${path}\``).join(', ');
            const more = matched.length > 5 ? ` and ${matched.length - 5} more` : '';

            const stackSection = [];
            if (stackNumber) {
              stackSection.push('', `This PR is the top of stack #${stackNumber}, so the chart comes from a head that contains every PR in it:`, '');
              stackSection.push(...(stack?.pull_requests?.length
                ? stack.pull_requests.map((pr, index) => `${index + 1}. #${pr.number} ${pr.title}`)
                : ['(see the stack view on this PR)']));
              if (matched.length) {
                stackSection.push('', `Built because ${shown}${more} changed somewhere in the stack.`);
              }
              stackSection.push('', 'Lower PRs publish nothing of their own; push a fix there, then `gh stack rebase && gh stack push` to rebuild this one.');
            }

            const sibling = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(siblingMarker));
            const siblingSection = sibling
              ? ['', sibling.body.includes(staleStart)
                  ? `A preview image for this pull request has a comment, but it is currently marked outdated: ${sibling.html_url}`
                  : `A preview image for this pull request is published too: ${sibling.html_url}`]
              : [];

            const body = [
              marker,
              `A preview chart for this pull request is available, packaged from \`${short}\`:`,
              '',
              '```bash',
              `helm install ${chartName} oci://${CHART_REF} --version ${PREVIEW_VERSION}`,
              '```',
              '',
              `Digest: \`${DIGEST}\`. The chart defaults to app \`${APP_VERSION}\`; add \`--set image.tag=pr-${issueNumber}\` to run this pull request's preview image instead, when one was published.`,
              ...stackSection,
              ...siblingSection,
              ...ttl,
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
            ].join('\n');

            await post(body);
