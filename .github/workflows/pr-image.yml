---
name: PR Preview Image

# What: Builds, pushes and signs a preview image for a pull request, tagged pr-<N>, and comments the reference on it.
# Fires on: pull requests against main whose cumulative diff touches an image input; in a native GitHub stack, only the top pull request.
# Needs: nothing for GHCR. Another registry needs a login step and its credentials.
# Safe to delete if: the project publishes no container image, or reviewers do not need one before merge.
#
# Self-contained on purpose: publish-image.yml only accepts a published
# vX.Y.Z release tag, and a preview must not weaken that check.
#
# The image-input allowlist lives in the `changes` job, not in the trigger's
# `paths` filter. GitHub evaluates `paths` against a pull request's own diff,
# which for a stacked pull request is only its top slice, so a docs-only top
# would never build the stack image. The job diffs against the stack base
# instead. A side effect is that this workflow always reports a status, so it
# is safe to require, unlike a path-filtered one.

on:
  pull_request:
    # `stacked`: GitHub opens the PRs of a stack before it links them, so
    # `opened` never carries `pull_request.stack`; the link fires `stacked`.
    types: [opened, synchronize, reopened, stacked]
    branches: [main]

permissions: {}

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check image inputs
    # A fork's GITHUB_TOKEN cannot push to the package, and dependabot runs
    # get a read-only token. In a native GitHub stack only the top pull
    # request builds: its head already contains every lower one, so each
    # lower image would be a prefix of it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      matched: ${{ steps.diff.outputs.matched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the diff below spans the whole stack
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the stack base
        id: diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || '' }}
          STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
          EVENT_ACTION: ${{ github.event.action }}
          # Only inputs the Dockerfile consumes: the root package it builds,
          # the packages it can import, the module files and the pins. Extend
          # when the image copies more than that.
          IMAGE_INPUTS: |
            ^[^/]+\.go$
            ^cmd/
            ^internal/
            ^pkg/
            ^go\.(mod|sum)$
            ^Dockerfile$
            ^versions\.env$
            ^\.github/workflows/pr-image\.yml$
        run: |
          set -euo pipefail
          echo "event=${EVENT_ACTION} stack=${STACK_NUMBER:-none}"
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${STACK_BASE_SHA:-${PR_BASE_SHA}}"
          # --no-renames: a rename out of the allowlist would otherwise show
          # only its new path and hide that an image input went away
          changed="$(git diff --name-only --no-renames "${base}...${HEAD_SHA}")"
          if matched="$(grep -Ef <(printf '%s' "${IMAGE_INPUTS}") <<<"${changed}")"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            # Named in the pull request comment, so a pull request that
            # changes no image input itself can see why its stack still
            # produces one.
            {
              echo "matched<<MATCHED_EOF"
              printf '%s\n' "${matched}"
              echo "MATCHED_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "No image input changed between ${base} and ${HEAD_SHA}. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  preview-image:
    name: Publish preview image
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: a short-lived OIDC identity instead of a signing key.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The head, not the merge commit, so the digest matches what the
          # comment says was built and a rebase of main cannot change it.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve image name
        id: target
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase path; repository names are not.
          echo "image=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.target.outputs.image }}:pr-${{ github.event.pull_request.number }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          provenance: false  # a preview carries a signature and an SBOM, not release provenance
          sbom: false        # replaced by the syft attestation below

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      # Sign and attest by digest, never by tag: pr-<N> is repointed on every push.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

  pr-comment:
    name: Comment preview image ref
    needs: [changes, preview-image]
    # Also runs when nothing was published: a build that is skipped, fails, or
    # belongs to a PR that is not the top of its stack leaves an earlier
    # reference standing, and the comment has to say that it is stale.
    if: >-
      always() &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      IMAGE: ${{ needs.preview-image.outputs.image }}
      DIGEST: ${{ needs.preview-image.outputs.digest }}
      PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STACK_NUMBER: ${{ github.event.pull_request.stack.number || '' }}
      MATCHED: ${{ needs.changes.outputs.matched }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      CHANGES_BUILD: ${{ needs.changes.outputs.build }}
      BUILD_RESULT: ${{ needs.preview-image.result }}
    steps:
      - name: Create or update PR comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          MARKER: "<!-- pr-preview-image -->"
          SIBLING_MARKER: "<!-- pr-preview-chart -->"
        with:
          script: |
            const marker = process.env.MARKER;
            const siblingMarker = process.env.SIBLING_MARKER;
            const staleStart = '<!-- preview:stale-start -->';
            const staleEnd = '<!-- preview:stale-end -->';
            const stackNumber = process.env.STACK_NUMBER;
            const short = process.env.HEAD_SHA.slice(0, 7);
            const repository = process.env.GITHUB_REPOSITORY;
            const issueNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const { IMAGE, DIGEST, PREVIEW_TAG } = process.env;
            const ref = `${IMAGE}@${DIGEST}`;
            // Fulcio records the workflow at the ref it ran from, refs/pull/N/merge.
            const identity = `^https://github\\.com/${owner}/${repo}/\\.github/workflows/pr-image\\.yml@`;

            const stack = stackNumber
              ? await github.request('GET /repos/{owner}/{repo}/stacks/{stack_number}', {
                  owner, repo, stack_number: Number(stackNumber),
                }).then(response => response.data).catch(error => {
                  core.warning(`Could not list stack #${stackNumber}: ${error.message}`);
                  return null;
                })
              : null;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));

            const post = async body => {
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body });
            };

            // The notice is delimited rather than pattern-matched, so a second
            // one replaces the first instead of stacking under it.
            const withoutNotice = body => {
              const kept = [];
              let inNotice = false;
              for (const line of body.split('\n')) {
                if (line === staleStart) { inNotice = true; continue; }
                if (line === staleEnd) { inNotice = false; continue; }
                // `:stale` also matches the inline marker the first
                // implementation used, so an old notice is not kept forever.
                if (!inNotice && line !== marker && !/^<!--[^>]*:stale/.test(line)) kept.push(line);
              }
              return kept.join('\n').trim();
            };

            if (process.env.BUILD_RESULT !== 'success') {
              // Nothing was published, so there is nothing to correct unless an
              // earlier revision left a reference behind.
              if (!existing) return;
              let reason;
              if (process.env.CHANGES_RESULT === 'skipped' && stackNumber) {
                const top = stack?.pull_requests?.[stack.pull_requests.length - 1];
                reason = `this PR is not the top of stack #${stackNumber}` +
                  (top ? `, so the stack's preview image is published on #${top.number}` : '');
              } else if (process.env.CHANGES_RESULT !== 'success') {
                // A failed or cancelled input check publishes nothing either,
                // and must not be reported as "no input changed".
                reason = `the image input check for \`${short}\` did not complete (${process.env.CHANGES_RESULT})`;
              } else if (process.env.CHANGES_BUILD !== 'true') {
                reason = `no image input changed between the base and \`${short}\``;
              } else {
                // The publish step repoints the mutable reference before it
                // signs, so a build that got that far has already replaced it.
                reason = `the preview image build for \`${short}\` did not succeed (${process.env.BUILD_RESULT}). ` +
                  'That build may already have repointed the preview reference, so trust the digest below rather than the tag';
              }
              await post([
                marker,
                staleStart,
                '> [!WARNING]',
                `> **Outdated:** ${reason}. What follows is from an earlier revision of this PR.`,
                staleEnd,
                '',
                withoutNotice(existing.body),
              ].join('\n'));
              return;
            }

            const matched = (process.env.MATCHED || '').split('\n').map(line => line.trim()).filter(Boolean);
            const shown = matched.slice(0, 5).map(path => `\`${path}\``).join(', ');
            const more = matched.length > 5 ? ` and ${matched.length - 5} more` : '';

            const stackSection = [];
            if (stackNumber) {
              stackSection.push('', `This PR is the top of stack #${stackNumber}, so the image comes from a head that contains every PR in it:`, '');
              stackSection.push(...(stack?.pull_requests?.length
                ? stack.pull_requests.map((pr, index) => `${index + 1}. #${pr.number} ${pr.title}`)
                : ['(see the stack view on this PR)']));
              if (matched.length) {
                stackSection.push('', `Built because ${shown}${more} changed somewhere in the stack.`);
              }
              stackSection.push('', 'Lower PRs publish nothing of their own; push a fix there, then `gh stack rebase && gh stack push` to rebuild this one.');
            }

            const sibling = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(siblingMarker));
            const siblingSection = sibling
              ? ['', sibling.body.includes(staleStart)
                  ? `A preview chart for this pull request has a comment, but it is currently marked outdated: ${sibling.html_url}`
                  : `A preview chart for this pull request is published too, and its comment carries the command that installs it against this image: ${sibling.html_url}`]
              : [];

            const body = [
              marker,
              `A preview image for this pull request is available, built from \`${short}\`:`,
              '',
              '```',
              `${IMAGE}:${PREVIEW_TAG}`,
              '```',
              '',
              `Digest: \`${DIGEST}\``,
              ...stackSection,
              ...siblingSection,
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'SBOM attestation:',
              '',
              '```bash',
              `cosign verify-attestation --type spdxjson ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
            ].join('\n');

            await post(body);
