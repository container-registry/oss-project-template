---
name: PR Preview Image

# What: Builds, pushes and signs a preview image for a pull request, tagged pr-<N>, and comments the reference on it.
# Fires on: pull requests against main whose cumulative diff touches an image input; in a native GitHub stack, only the top pull request.
# Needs: nothing for GHCR. Another registry needs a login step and its credentials.
# Safe to delete if: the project publishes no container image, or reviewers do not need one before merge.
#
# Self-contained on purpose: publish-image.yml only accepts a published
# vX.Y.Z release tag, and a preview must not weaken that check.
#
# The image-input allowlist lives in the `changes` job, not in the trigger's
# `paths` filter. GitHub evaluates `paths` against a pull request's own diff,
# which for a stacked pull request is only its top slice, so a docs-only top
# would never build the stack image. The job diffs against the stack base
# instead. A side effect is that this workflow always reports a status, so it
# is safe to require, unlike a path-filtered one.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Check image inputs
    # A fork's GITHUB_TOKEN cannot push to the package, and dependabot runs
    # get a read-only token. In a native GitHub stack only the top pull
    # request builds: its head already contains every lower one, so each
    # lower image would be a prefix of it.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      (github.event.pull_request.stack == null ||
       github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
      stack_number: ${{ github.event.pull_request.stack.number || '' }}
      stack_tag: ${{ github.event.pull_request.stack && format('stack-{0}', github.event.pull_request.stack.number) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the diff below spans the whole stack
          fetch-depth: 0
          persist-credentials: false

      - name: Diff against the stack base
        id: diff
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STACK_BASE_SHA: ${{ github.event.pull_request.stack.base.sha || '' }}
          # Only inputs the Dockerfile consumes. Extend when the image copies
          # more than the Go module and its pins.
          IMAGE_INPUTS: |
            ^cmd/
            ^internal/
            ^pkg/
            ^go\.(mod|sum)$
            ^Dockerfile$
            ^versions\.env$
            ^\.github/workflows/pr-image\.yml$
        run: |
          set -euo pipefail
          if [ ! -f Dockerfile ]; then
            echo "No Dockerfile. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${STACK_BASE_SHA:-${PR_BASE_SHA}}"
          changed="$(git diff --name-only "${base}...${HEAD_SHA}")"
          if grep -Ef <(printf '%s' "${IMAGE_INPUTS}") <<<"${changed}"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No image input changed between ${base} and ${HEAD_SHA}. Skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  preview-image:
    name: Publish preview image
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: a short-lived OIDC identity instead of a signing key.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The head, not the merge commit, so the digest matches what the
          # comment says was built and a rebase of main cannot change it.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve image name and tags
        id: target
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
          STACK_TAG: ${{ needs.changes.outputs.stack_tag }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase path; repository names are not.
          image="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          tags="${image}:${PREVIEW_TAG}"
          if [ -n "${STACK_TAG}" ]; then
            tags="${tags}"$'\n'"${image}:${STACK_TAG}"
          fi
          {
            echo "image=${image}"
            echo "tags<<TAGS"
            echo "${tags}"
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.target.outputs.tags }}
          build-args: |
            VERSION=pr-${{ github.event.pull_request.number }}
          provenance: false  # a preview carries a signature and an SBOM, not release provenance
          sbom: false        # replaced by the syft attestation below

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      # Sign and attest by digest, never by tag: pr-<N> is repointed on every push.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

  pr-comment:
    name: Comment preview image ref
    needs: [changes, preview-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      IMAGE: ${{ needs.preview-image.outputs.image }}
      DIGEST: ${{ needs.preview-image.outputs.digest }}
      PREVIEW_TAG: pr-${{ github.event.pull_request.number }}
      STACK_NUMBER: ${{ needs.changes.outputs.stack_number }}
      STACK_TAG: ${{ needs.changes.outputs.stack_tag }}
    steps:
      - name: Create or update the comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const marker = '<!-- pr-preview-image -->'
            const { IMAGE, DIGEST, PREVIEW_TAG, STACK_NUMBER, STACK_TAG } = process.env
            const { owner, repo } = context.repo
            const issueNumber = context.payload.pull_request.number
            const ref = `${IMAGE}@${DIGEST}`
            // Fulcio records the workflow at the ref it ran from, refs/pull/N/merge.
            const identity =
              `^https://github\\.com/${owner}/${repo}/\\.github/workflows/pr-image\\.yml@`

            let stack = []
            if (STACK_NUMBER) {
              try {
                const { data } = await github.request('GET /repos/{owner}/{repo}/stacks/{stack_number}', {
                  owner, repo, stack_number: Number(STACK_NUMBER),
                })
                stack = [
                  '',
                  `This pull request is the top of stack #${STACK_NUMBER}. The image is built from its head, so it contains every pull request in the stack:`,
                  '',
                  ...data.pull_requests.map((pr, i) => `${i + 1}. #${pr.number} ${pr.title}`),
                  '',
                  `\`${IMAGE}:${STACK_TAG}\` always points at the latest build of the top of the stack. Lower pull requests get no image of their own; push a fix there and \`gh stack rebase && gh stack push\` to rebuild.`,
                ]
              } catch (error) {
                core.warning(`Could not list stack #${STACK_NUMBER}: ${error.message}`)
                stack = ['', `This pull request is the top of stack #${STACK_NUMBER}; the image contains the whole stack and is also tagged \`${STACK_TAG}\`.`]
              }
            }

            const body = [
              marker,
              'A preview image for this pull request is available:',
              '',
              '```',
              `${IMAGE}:${PREVIEW_TAG}`,
              '```',
              '',
              `Digest: \`${DIGEST}\``,
              ...stack,
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'SBOM attestation:',
              '',
              '```bash',
              `cosign verify-attestation --type spdxjson ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
            ].join('\n')

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issueNumber, per_page: 100,
            })
            const existing = comments.find(c =>
              c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
              return
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: issueNumber, body })
