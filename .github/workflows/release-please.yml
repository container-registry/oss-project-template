---
name: Release Please

# What: Opens release pull requests for the app and for the chart, then triggers the publish workflows.
# Fires on: push to main, or manual dispatch.
# Needs: nothing. Repository settings must allow Actions to create pull requests.
# Safe to delete if: releases are cut by hand. Removes versioning automation entirely.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

# One fixed group, not keyed on the ref: a workflow_dispatch from any branch
# still reconciles main, and two parallel runs each opened a release PR.
# With cancel-in-progress off a newer run replaces a pending one, never a
# running one; release-please reads full history, so nothing is lost.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels its own PR (autorelease: pending/tagged) via the
      # Issues API, which is a separate scope from pull-requests.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/config-app.json
          manifest-file: .release-please/manifest-app.json

  publish-release-assets:
    needs: [release-please]
    # release_created is the string "true", not a boolean.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  publish-image:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # The chart has its own release line scoped to deploy/chart by its own
  # config and manifest, so a chart fix does not force an app release and an
  # app release does not republish an unchanged chart. It is a SEPARATE
  # release-please instance rather than a second package in the app manifest:
  # a second package switches every output to the "<path>--<name>" form and
  # breaks the jobs above that read the unprefixed ones. `task bootstrap
  # --chart=none` removes this job and publish-helm-chart.
  release-please-chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs['deploy/chart--release_created'] }}
      tag_name: ${{ steps.release.outputs['deploy/chart--tag_name'] }}
      version: ${{ steps.release.outputs['deploy/chart--version'] }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please/config-chart.json
          manifest-file: .release-please/manifest-chart.json

  # Driven by the chart's own release line. The chart references the app image
  # by appVersion, which an earlier app release has already published, so this
  # does not wait on publish-image.
  publish-helm-chart:
    needs: [release-please-chart]
    if: ${{ needs.release-please-chart.outputs.release_created == 'true' }}
    permissions:
      # A reusable workflow is capped by the caller's grant; the publish job
      # needs contents: write for `gh release edit`.
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-chart.yml
    with:
      tag_name: ${{ needs.release-please-chart.outputs.tag_name }}
    # Empty by default; publish-chart.yml then pushes anonymously to ttl.sh.
    # See its header for GHCR and other registries.
    secrets:
      CHART_REGISTRY_USERNAME: ${{ secrets.CHART_REGISTRY_USERNAME }}
      CHART_REGISTRY_PASSWORD: ${{ secrets.CHART_REGISTRY_PASSWORD }}

  # Appends the verification commands to the release body. Idempotent: it
  # replaces the marked section rather than appending a second copy.
  document-artifacts:
    # publish-release-assets too: the body it writes tells people to verify
    # app-linux-amd64 and checksums.txt, which that job uploads.
    needs: [release-please, publish-image, publish-release-assets]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Append verification instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        with:
          script: |
            const marker = '<!-- artifact-verification -->'
            const { TAG, IMAGE, DIGEST } = process.env
            const ref = `${IMAGE}@${DIGEST}`
            // Fulcio records the reusable workflow at the ref it was
            // resolved at. publish-image.yml is called locally from a run on
            // the default branch, so that ref is refs/heads/main, not the tag.
            // A regexp keeps the command correct if the release ever runs from
            // a release branch instead.
            const identity =
              `^https://github\\.com/${context.repo.owner}/${context.repo.repo}` +
              `/\\.github/workflows/publish-image\\.yml@`

            const section = [
              marker,
              '',
              '## Verifying this release',
              '',
              '```',
              ref,
              '```',
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'SBOM attestation:',
              '',
              '```bash',
              `cosign verify-attestation --type spdxjson ${ref} \\`,
              `  --certificate-identity-regexp '${identity}' \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'Binary provenance and checksums:',
              '',
              '```bash',
              `gh attestation verify app-linux-amd64 --repo ${context.repo.owner}/${context.repo.repo}`,
              'sha256sum -c checksums.txt',
              '```',
            ].join('\n')

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: TAG,
            })
            const body = (release.body || '').split(marker)[0].trimEnd()

            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.id,
              body: `${body}\n\n${section}\n`,
            })
