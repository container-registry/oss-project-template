---
name: Release Please

# What: Opens and merges release pull requests, then triggers the publish workflows.
# Fires on: push to main, or manual dispatch.
# Needs: nothing. Repository settings must allow Actions to create pull requests.
# Safe to delete if: releases are cut by hand. Removes versioning automation entirely.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please labels its own PR (autorelease: pending/tagged) via the
      # Issues API, which is a separate scope from pull-requests.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-release-assets:
    needs: [release-please]
    # release_created is the string "true", not a boolean.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  publish-image:
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Appends the verification commands to the release body. Idempotent: it
  # replaces the marked section rather than appending a second copy.
  document-artifacts:
    needs: [release-please, publish-image]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Append verification instructions
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
        with:
          script: |
            const marker = '<!-- artifact-verification -->'
            const { TAG, IMAGE, DIGEST } = process.env
            const ref = `${IMAGE}@${DIGEST}`
            const identity =
              `https://github.com/${context.repo.owner}/${context.repo.repo}` +
              `/.github/workflows/publish-image.yml@refs/tags/${TAG}`

            const section = [
              marker,
              '',
              '## Verifying this release',
              '',
              '```',
              ref,
              '```',
              '',
              'Signature:',
              '',
              '```bash',
              `cosign verify ${ref} \\`,
              `  --certificate-identity ${identity} \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'SBOM attestation:',
              '',
              '```bash',
              `cosign verify-attestation --type spdxjson ${ref} \\`,
              `  --certificate-identity ${identity} \\`,
              '  --certificate-oidc-issuer https://token.actions.githubusercontent.com',
              '```',
              '',
              'Binary provenance and checksums:',
              '',
              '```bash',
              `gh attestation verify app-linux-amd64 --repo ${context.repo.owner}/${context.repo.repo}`,
              'sha256sum -c checksums.txt',
              '```',
            ].join('\n')

            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner, repo: context.repo.repo, tag: TAG,
            })
            const body = (release.body || '').split(marker)[0].trimEnd()

            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: release.id,
              body: `${body}\n\n${section}\n`,
            })
