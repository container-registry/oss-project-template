---
name: PR Size Labeler

# DO NOT ADD actions/checkout TO THIS WORKFLOW.
# pull_request_target runs in the base repository's context with a writable
# token. Checking out the pull request head here executes a fork's code with
# that token, which is remote code execution against this repository.
# The trigger is required because a fork pull request must still be labelled by size.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, synchronize, reopened]

# See the note in labeler.yml about pull_request_target. No checkout here either.
permissions: {}

concurrency:
  group: size-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  size-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9  # v1.10.4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'size/XS'
          xs_max_size: 10
          s_label: 'size/S'
          s_max_size: 100
          m_label: 'size/M'
          m_max_size: 500
          l_label: 'size/L'
          l_max_size: 1000
          xl_label: 'size/XL'
          fail_if_xl: false
          message_if_xl: |
            This PR is quite large. Consider breaking it into smaller PRs for easier review.
          files_to_ignore: |
            "package-lock.json"
            "go.sum"
            "*.lock"
            "*.snap"
