---
name: Publish Image

# What: Builds, pushes, verifies, signs and attests the container image.
# Fires on: called by release-please.yml after a release is created.
# Needs: nothing for GHCR. Another registry needs a login step and its credentials. The tag must belong to a published release whose target is the tagged commit, which is how release-please creates them.
# Safe to delete if: the project publishes no container image. Remove the caller in release-please.yml too.
#
# Builds, pushes, signs and attests the container image.
#
# Defaults to GHCR authenticated with GITHUB_TOKEN, so it works in a fresh
# repository with no secrets configured. Point `image` somewhere else and add
# a login step if the project publishes to another registry.
#
# Delete this workflow and its caller in release-please.yml if the project does
# not ship a container image.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag being published, used as the image tag
        required: true
        type: string
      image:
        description: Fully qualified image name, without a tag
        required: false
        default: ''
        type: string
    outputs:
      # A reusable workflow only exposes outputs it declares here; job-level
      # outputs alone are not visible to the caller.
      digest:
        description: Digest of the pushed multi-arch image
        value: ${{ jobs.publish.outputs.digest }}
      image:
        description: Image name the digest belongs to
        value: ${{ jobs.publish.outputs.image }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing and provenance: a short-lived OIDC identity instead of
      # a long-lived signing key.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      # The tag is the only input that decides what ships, so it is resolved
      # to a commit here and the checkout uses that commit. A tag moved after
      # the release was created cannot change what is built, and a dispatch
      # with a typo, an unknown tag or a draft release fails here instead of
      # publishing. Annotated tags are dereferenced to the commit they point at.
      - name: Resolve and validate the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag_name must match vX.Y.Z, got '${TAG_NAME}'"
            exit 1
          fi
          # Each call is captured and checked rather than read from a process
          # substitution: errexit ignores what a process substitution exits
          # with, and gh prints its error body on stdout, so a 404 otherwise
          # lands in the variables and is reported as a target mismatch.
          if ! ref=$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG_NAME}" --jq '"\(.object.type) \(.object.sha)"'); then
            echo "::error::${TAG_NAME} is not a tag in ${GH_REPO}"
            exit 1
          fi
          read -r type sha <<<"${ref}"
          if [ "${type}" = "tag" ]; then
            if ! sha=$(gh api "repos/${GH_REPO}/git/tags/${sha}" --jq '.object.sha'); then
              echo "::error::cannot dereference the annotated tag ${TAG_NAME} in ${GH_REPO}"
              exit 1
            fi
          fi
          if ! release=$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq '"\(.draft) \(.target_commitish)"'); then
            echo "::error::${TAG_NAME} has no GitHub release. release-please creates one when the release pull request is merged."
            exit 1
          fi
          read -r draft target <<<"${release}"
          if [ "${draft}" != "false" ] || [ "${target}" != "${sha}" ]; then
            echo "::error::${TAG_NAME} must be a published release whose target is ${sha} (draft=${draft}, target=${target}). release-please creates releases that way; a release made by hand does not qualify."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      # Must stay above the build: it installs the Task the next step needs.
      - uses: ./.github/actions/setup
        with:
          go: "false"

      - name: Read the build platforms from the Taskfile
        id: platforms
        run: |
          set -euo pipefail
          platforms="$(task --silent image:platforms)"
          if [ -z "${platforms}" ]; then
            echo "::error::task image:platforms printed nothing; IMAGE_PLATFORMS is not set in Taskfile.yml"
            exit 1
          fi
          echo "list=${platforms}" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: target
        env:
          # Interpolated through the environment rather than inline, so a value
          # containing shell metacharacters cannot alter the command.
          OVERRIDE: ${{ inputs.image }}
          DEFAULT: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          image="${OVERRIDE:-$DEFAULT}"
          # GHCR requires a lowercase path; repository names are not.
          echo "image=$(echo "$image" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: ${{ steps.platforms.outputs.list }}
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ inputs.tag_name }}
            ${{ steps.target.outputs.image }}:latest
          build-args: |
            VERSION=${{ inputs.tag_name }}
          provenance: false  # replaced by the attestation below
          sbom: false        # replaced by the syft attestation below

      # Reads the index back from the registry and fails on a missing,
      # unexpected or duplicated platform, before anything is signed.
      # PLATFORMS is unset on purpose: the assertion must come from the Taskfile.
      - name: Verify the published platforms
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: task image:verify IMAGE_REF="${IMAGE_REF}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2

      # Sign and attest by digest, never by tag: a tag can be repointed at a
      # different image after the signature is made.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
