---
name: Publish Image

# Builds, pushes, signs and attests the container image.
#
# Defaults to GHCR authenticated with GITHUB_TOKEN, so it works in a fresh
# repository with no secrets configured. Point `image` somewhere else and add
# a login step if the project publishes to another registry.
#
# Delete this workflow and its caller in release-please.yml if the project does
# not ship a container image.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag being published, used as the image tag
        required: true
        type: string
      image:
        description: Fully qualified image name, without a tag
        required: false
        default: ''
        type: string
    outputs:
      # A reusable workflow only exposes outputs it declares here; job-level
      # outputs alone are not visible to the caller.
      digest:
        description: Digest of the pushed multi-arch image
        value: ${{ jobs.publish.outputs.digest }}
      image:
        description: Image name the digest belongs to
        value: ${{ jobs.publish.outputs.image }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing and provenance: a short-lived OIDC identity instead of
      # a long-lived signing key.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.tag_name }}
          persist-credentials: false

      - name: Resolve image name
        id: target
        env:
          # Interpolated through the environment rather than inline, so a value
          # containing shell metacharacters cannot alter the command.
          OVERRIDE: ${{ inputs.image }}
          DEFAULT: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          image="${OVERRIDE:-$DEFAULT}"
          # GHCR requires a lowercase path; repository names are not.
          echo "image=$(echo "$image" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ inputs.tag_name }}
            ${{ steps.target.outputs.image }}:latest
          build-args: |
            VERSION=${{ inputs.tag_name }}
          provenance: false  # replaced by the attestation below
          sbom: false        # replaced by the syft attestation below

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      # Sign and attest by digest, never by tag: a tag can be repointed at a
      # different image after the signature is made.
      - name: Sign the image
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}"

      - name: Generate and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          syft "${IMAGE_REF}" -o spdx-json > sbom.spdx.json
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE_REF}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.target.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
