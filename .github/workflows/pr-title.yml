---
name: PR Title

# What: Requires the pull request title to be a conventional commit.
# Fires on: pull request opened, edited or synchronized.
# Needs: nothing.
# Safe to delete if: never, while release-please is in use. The title becomes the squash commit it parses.
#
# DO NOT ADD actions/checkout TO THIS WORKFLOW.
#
# pull_request_target, not pull_request: with pull_request, a pull request that
# edits this file runs its own edited copy, so the check it is supposed to pass
# can be replaced with one that always succeeds. pull_request_target runs the
# definition from the base branch instead. The action reads the title from the
# event payload and never needs the code, so the usual danger of this trigger
# does not apply here as long as nothing checks out the head.
on:  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, edited, synchronize]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      scope: ${{ steps.lint.outputs.scope }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^.{1,100}$
          subjectPatternError: |
            Subject must be 100 characters or less.

  # release-please has no scope filter and drops a commit from the app line
  # only when every file it touches is under exclude-paths. A (chart)-scoped
  # pull request that also edits one root file therefore lands in the app
  # changelog and bumps the app version. The negated patterns mirror
  # exclude-paths in .release-please/config-app.json plus the chart's own
  # tree; keep them in sync. Gated on the scope the lint job parsed, not on a
  # title substring, so subject text mentioning "(chart):" cannot trigger it.
  # dorny/paths-filter lists the changed files through the API and needs no
  # checkout, which is what keeps this safe under pull_request_target.
  chart-scope-paths:
    name: Chart Scope Paths
    needs: lint
    if: needs.lint.outputs.scope == 'chart'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          list-files: shell
          filters: |
            app:
              - '**'
              - '!.github/**'
              - '!docs/**'
              - '!deploy/**'
              - '!taskfile/**'
              - '!.release-please/**'

      - name: Fail on app-release paths
        if: steps.filter.outputs.app == 'true'
        env:
          FILES: ${{ steps.filter.outputs.app_files }}
        run: |
          echo "::error::A (chart)-scoped pull request may only touch paths the app release line excludes. Offending: ${FILES}"
          exit 1
