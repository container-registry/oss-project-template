---
name: DCO

# What: Fails a pull request whose commits are not signed off.
# Fires on: every pull request.
# Needs: nothing.
# Safe to delete if: the project does not require the Developer Certificate of Origin.
#
# In-repo Developer Certificate of Origin gate.
#
# The dco2 GitHub App gives nicer remediation UX, but it is an app somebody has
# to remember to install. This runs in the repository, so the gate exists from
# the first pull request. It applies the same two exemptions dco2 does, so the
# two never disagree on a pull request: merge commits and bot commits.
#
# Reads the commits over the API rather than checking the branch out. That
# resolves each author to a GitHub account, so `type: Bot` cannot be forged by
# setting a local git user.name, and no fork code reaches the runner.

on:
  pull_request:

permissions: {}

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check every commit is signed off
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TOTAL_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail

          # The endpoint lists at most 250 commits. Fail rather than report a
          # partial read as a pass.
          if [ "${TOTAL_COMMITS}" -gt 250 ]; then
            echo "::error::This pull request has ${TOTAL_COMMITS} commits and the API lists at most 250, so the sign-off check cannot cover it. Split the pull request."
            exit 1
          fi

          # Assigned, not read straight into the loop: a process substitution
          # hides the exit status from set -e, so a failed API call would empty
          # the loop and pass the gate.
          # Messages are multi-line, so the filter base64-encodes each one to
          # keep a commit per line.
          commits=$(gh api --paginate "repos/${REPO}/pulls/${PR}/commits" \
            --jq '.[] | select((.parents | length) < 2) | select(.author.type != "Bot") | "\(.sha):\(.commit.message | @base64)"')

          missing=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            sha=${entry%%:*}
            message=$(printf '%s' "${entry#*:}" | base64 -d)
            # Requires a name and an address, not just the trailer key: a
            # bare "Signed-off-by:" line satisfied the previous check.
            if ! printf '%s\n' "$message" | grep -qE "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$"; then
              echo "::error::Missing DCO sign-off: $sha $(printf '%s\n' "$message" | head -1)"
              missing=1
            fi
          done <<< "$commits"

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit needs a Signed-off-by trailer certifying the DCO"
            echo "(https://developercertificate.org/)."
            echo ""
            echo "  Last commit:  git commit --amend -s && git push --force-with-lease"
            echo "  Whole branch: git rebase --signoff origin/main && git push --force-with-lease"
            exit 1
          fi
          echo "All commits are signed off."
