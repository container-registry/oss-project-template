---
name: PR Release Notes

# What: Checks the "## Release Notes" section of the pull request description.
# Fires on: pull request opened, edited, synchronized or reopened.
# Needs: nothing.
# Safe to delete if: release notes are not taken from pull requests. Then also drop
#   release-notes.yml and the "Release Notes" rules in CONTRIBUTING.md.
#
# pull_request, not pull_request_target: the check runs a script, so it needs a
# checkout, and a pull_request_target workflow must never check one out. The
# token is read-only either way.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: pr-release-notes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-notes:
    name: Release Notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check the release notes section
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/check-pr-release-notes.mjs
