---
name: CI

# Build and test gates for the Go pack. Delete this workflow along with
# go.mod, main.go and the Go tasks if the project is not Go; the language
# neutral gates live in hygiene.yml and keep working either way.

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'NOTICE']
  schedule:
    # govulncheck reports newly published advisories against unchanged code,
    # so it needs to run on a clock rather than only on a push.
    - cron: '0 6 * * 1'

permissions: {}

concurrency:
  # The event name is part of the group so a scheduled run cannot cancel a
  # push run that happens to share a ref.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task build

  test:
    name: Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task test

  lint:
    name: Lint Go
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task lint

  license-check:
    name: License Check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task license-check
      - name: License report
        if: always()
        run: task license-report

  vuln-check:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: task vuln-check
