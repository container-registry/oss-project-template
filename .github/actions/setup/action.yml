---
name: Setup
description: Install Task at the pinned version, and optionally the Go toolchain

# Task is the single entry point for build and test commands, so CI runs the
# same thing a contributor runs locally. Keep new commands in Taskfile.yml
# rather than inlining them into a workflow step.

inputs:
  go:
    description: Install the Go toolchain from go.mod
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Go
      if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: go.mod

    - name: Install Task
      shell: bash
      run: |  # zizmor: ignore[github-env] Adds only this action's checksum-verified install directory to PATH.
        set -euo pipefail

        # versions.env is the single source of truth for the pin.
        version="$(grep '^TASK_VERSION=' versions.env | cut -d= -f2)"
        version="${version#v}"
        if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Could not read a valid TASK_VERSION from versions.env (got '${version}')" >&2
          exit 1
        fi

        case "$(uname -s)" in
          Linux) os="linux" ;;
          Darwin) os="darwin" ;;
          *) echo "::error::Unsupported OS for Task: $(uname -s)" >&2; exit 1 ;;
        esac

        case "$(uname -m)" in
          x86_64|amd64) arch="amd64" ;;
          aarch64|arm64) arch="arm64" ;;
          *) echo "::error::Unsupported architecture for Task: $(uname -m)" >&2; exit 1 ;;
        esac

        archive="task_${os}_${arch}.tar.gz"
        base="https://github.com/go-task/task/releases/download/v${version}"
        tool_dir="${RUNNER_TEMP:-${PWD}/.tools}/task"
        mkdir -p "${tool_dir}/bin"

        curl -fsSL "${base}/${archive}" -o "${tool_dir}/${archive}"
        curl -fsSL "${base}/task_checksums.txt" -o "${tool_dir}/task_checksums.txt"

        # macOS runners ship shasum but not sha256sum.
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "${tool_dir}" && grep "  ${archive}$" task_checksums.txt | sha256sum -c -)
        else
          (cd "${tool_dir}" && grep "  ${archive}$" task_checksums.txt | shasum -a 256 -c -)
        fi

        tar -xzf "${tool_dir}/${archive}" -C "${tool_dir}" task
        install -m 0755 "${tool_dir}/task" "${tool_dir}/bin/task"
        echo "${tool_dir}/bin" >> "${GITHUB_PATH}"

    - name: Verify Task
      shell: bash
      run: task --version
