# Local git hooks. These mirror the cheap half of the CI gates so a mistake is
# caught before it costs a CI round trip. Install with `task setup`.
# Skip once with `LEFTHOOK=0 git commit ...`.

pre-commit:
  parallel: true
  commands:
    spellcheck:
      glob: "*.{md,txt,yml,yaml}"
      run: typos --config .typos.toml {staged_files}
    yamllint:
      glob: "*.{yml,yaml}"
      run: yamllint --strict {staged_files}
    actionlint:
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    repo-lint:
      # Cheap, and it is what catches a dangling doc reference or a label the
      # labeler emits but settings.yml does not declare.
      glob: "*.{md,yml,yaml,json}"
      run: python3 .github/scripts/repo-lint.py

commit-msg:
  commands:
    conventional-commit:
      run: |
        msg=$(head -1 {1})
        # Same pattern as `task commit-lint` and the pr-title workflow.
        pattern="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+"
        if ! echo "$msg" | grep -Eq "$pattern"; then
          echo "ERROR: Commit message must follow Conventional Commits format"
          echo "  Format: <type>[optional scope]: <description>"
          echo "  Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo "  Example: feat: add user authentication"
          echo "  Example: fix(api): resolve timeout issue"
          echo "  Got: $msg"
          exit 1
        fi
    dco-signoff:
      run: |
        # Same regex as dco.yml and `task dco-check`: a bare trailer has to
        # fail here rather than on the pull request.
        if ! grep -qE "^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>[:space:]]+>[[:space:]]*$" {1}; then
          echo "ERROR: Missing DCO sign-off with a name and an address. Use 'git commit -s'"
          exit 1
        fi

pre-push:
  commands:
    check:
      run: task check
