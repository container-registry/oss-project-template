# Helm chart quality gate.
#
# Every task here runs identically in CI (.github/workflows/chart-ci.yml), which
# installs the same tool versions from versions.env. Tool tasks prefer a local
# binary and fall back to Docker so the gate is runnable without installing
# anything; `task helm:ci` runs the whole thing.
---
version: '3'

vars:
  CHART_DIR: deploy/chart
  CHART_NAME:
    sh: awk -F'[:[:space:]]+' '$1 == "name" { print $2; exit }' deploy/chart/Chart.yaml
  # Repo-owned yamllint config for chart-testing: release-please's Chart.yaml
  # stamping style fails ct's shipped strict conf.
  CT_LINT_CONF: '{{.CT_LINT_CONF | default "taskfile/ct-lintconf.yaml"}}'
  TRIVY_SARIF: '{{.TRIVY_SARIF | default "trivy-chart.sarif"}}'

tasks:
  # --- Individual checks ---------------------------------------------------

  lint:helm:
    desc: helm lint --strict
    cmd: helm lint --strict {{.CHART_DIR}}

  template:
    desc: Render the default values and fail on any template error
    cmd: helm template test {{.CHART_DIR}} > /dev/null

  lint:ct:
    desc: chart-testing lint (Chart.yaml schema, yamllint, every ci/*-values.yaml renders)
    cmd: |
      if command -v ct >/dev/null 2>&1; then
        ct lint --charts {{.CHART_DIR}} --lint-conf {{.CT_LINT_CONF}} \
          --validate-maintainers=false --target-branch main
      else
        docker run --rm -v "$(pwd)":/workdir -w /workdir \
          quay.io/helmpack/chart-testing:v{{.CT_VERSION}} \
          ct lint --charts {{.CHART_DIR}} --lint-conf {{.CT_LINT_CONF}} \
          --validate-maintainers=false --target-branch main
      fi

  lint:conf:drift:
    desc: Fail if taskfile/ct-lintconf.yaml has drifted from chart-testing's own etc/lintconf.yaml
    # The fork is a copy of upstream's file with exactly one rule changed, and
    # nothing re-checked it when CT_VERSION moved. Compare against the pinned
    # release rather than against main: the pin is what ct lint actually runs.
    cmd: |
      set -eu
      work="$(mktemp -d "${TMPDIR:-/tmp}/ct-lintconf.XXXXXX")"
      trap 'rm -rf "${work}"' EXIT

      # chart-ci.yml already extracted the release tarball and points
      # CT_CHART_YAML_SCHEMA at etc/chart_schema.yaml inside it, so in CI the
      # sibling file is on disk and there is nothing to download.
      upstream=""
      if [ -n "${CT_CHART_YAML_SCHEMA:-}" ] && [ -f "${CT_CHART_YAML_SCHEMA%/*}/lintconf.yaml" ]; then
        upstream="${CT_CHART_YAML_SCHEMA%/*}/lintconf.yaml"
      else
        cache="${TMPDIR:-/tmp}/ct-{{.CT_VERSION}}"
        if [ ! -f "${cache}/lintconf.yaml" ]; then
          mkdir -p "${cache}"
          curl -fsSL "https://github.com/helm/chart-testing/releases/download/v{{.CT_VERSION}}/chart-testing_{{.CT_VERSION}}_linux_amd64.tar.gz" \
            -o "${work}/ct.tar.gz"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "{{.CT_SHA256_LINUX_AMD64}}  ${work}/ct.tar.gz" | sha256sum -c -
          else
            echo "{{.CT_SHA256_LINUX_AMD64}}  ${work}/ct.tar.gz" | shasum -a 256 -c -
          fi
          # Stage through mktemp and rename into place. The rename keeps a
          # concurrent run from reading a half-written file, and mktemp is
          # what stops a redirect into a predictable name from following a
          # symlink planted in a world-writable cache directory.
          staged="$(mktemp "${cache}/.lintconf.XXXXXX")"
          trap 'rm -rf "${work}" "${staged}"' EXIT
          tar -xzOf "${work}/ct.tar.gz" etc/lintconf.yaml > "${staged}"
          mv -f "${staged}" "${cache}/lintconf.yaml"
        fi
        upstream="${cache}/lintconf.yaml"
      fi

      # Comment-only lines are the fork's own header; inline comments are
      # upstream's and are compared. Applying the one intended change to
      # upstream makes every remaining difference drift, printed as a diff.
      grep -v '^[[:space:]]*#' "${upstream}" \
        | sed 's/^\([[:space:]]*min-spaces-from-content:\) 2$/\1 1/' > "${work}/expected.yaml"
      grep -v '^[[:space:]]*#' taskfile/ct-lintconf.yaml > "${work}/actual.yaml"
      if ! diff -u "${work}/expected.yaml" "${work}/actual.yaml"; then
        echo "taskfile/ct-lintconf.yaml has drifted from chart-testing v{{.CT_VERSION}} etc/lintconf.yaml." >&2
        echo "Re-fork it from that release and keep only the comments.min-spaces-from-content change." >&2
        exit 1
      fi
      echo "ct-lintconf.yaml matches chart-testing v{{.CT_VERSION}} apart from min-spaces-from-content."

  lint:ah:
    desc: Validate the Artifact Hub metadata
    cmd: |
      if command -v ah >/dev/null 2>&1; then
        ah lint --kind helm --path {{.CHART_DIR}}
      else
        docker run --rm -v "$(pwd)/{{.CHART_DIR}}":/chart \
          artifacthub/ah:v{{.AH_VERSION}} ah lint --kind helm --path /chart
      fi

  lint:kube:
    desc: kube-linter over every ci/ values scenario
    vars:
      CI_VALUES:
        sh: find {{.CHART_DIR}}/ci -name '*-values.yaml' | sort
    cmds:
      - for: {var: CI_VALUES}
        cmd: |
          echo "kube-linter: {{.ITEM}}"
          if command -v kube-linter >/dev/null 2>&1; then
            helm template test {{.CHART_DIR}} -f {{.ITEM}} | kube-linter lint --format=plain -
          else
            # stdin rather than a bind mount: a bind mount resolves on the
            # Docker host, which is not the workspace when the daemon is remote.
            helm template test {{.CHART_DIR}} -f {{.ITEM}} \
              | docker run --rm -i stackrox/kube-linter:v{{.KUBE_LINTER_VERSION}} lint --format=plain -
          fi

  lint:schema:
    desc: Compile values.schema.json strictly
    # A strict compile catches invalid or mistyped JSON Schema keywords, which
    # the spec otherwise ignores in silence ("min" instead of "minimum"
    # validates nothing at all).
    cmd: |
      if command -v npx >/dev/null 2>&1; then
        npx -y ajv-cli@{{.AJV_CLI_VERSION}} compile -s {{.CHART_DIR}}/values.schema.json \
          --spec=draft2020 --strict=true --allowUnionTypes=true
      else
        docker run --rm -v "$(pwd)/{{.CHART_DIR}}":/chart -w /chart \
          node:{{.NODE_VERSION}}-alpine \
          npx -y ajv-cli@{{.AJV_CLI_VERSION}} compile -s values.schema.json \
          --spec=draft2020 --strict=true --allowUnionTypes=true
      fi

  unittest:
    desc: helm unittest
    cmd: helm unittest {{.CHART_DIR}}

  gitops-determinism:
    desc: Render the GitOps scenario twice and require byte-identical output
    cmds:
      # This is what Argo CD does on every sync. Any diff means the chart
      # generates something at render time, which shows up as perpetual drift.
      - helm template app {{.CHART_DIR}} --namespace app -f {{.CHART_DIR}}/ci/gitops-values.yaml > "${TMPDIR:-/tmp}/gitops-1.yaml"
      - helm template app {{.CHART_DIR}} --namespace app -f {{.CHART_DIR}}/ci/gitops-values.yaml > "${TMPDIR:-/tmp}/gitops-2.yaml"
      - defer: rm -f "${TMPDIR:-/tmp}/gitops-1.yaml" "${TMPDIR:-/tmp}/gitops-2.yaml"
      - >-
        diff -u "${TMPDIR:-/tmp}/gitops-1.yaml" "${TMPDIR:-/tmp}/gitops-2.yaml"
        || (echo "Chart rendering is not deterministic; GitOps engines would see perpetual drift." && exit 1)

  trivy:
    desc: Scan the rendered manifests for misconfigurations
    # One shell: the manifests are rendered into a directory of this run's
    # own, outside the chart, so an interrupt cannot leave a dump where
    # `helm package` would ship it and two runs cannot delete each other's.
    cmd: |
      set -eu
      scan="$(mktemp -d "${TMPDIR:-/tmp}/chart-trivy.XXXXXX")"
      trap 'rm -rf "${scan}"' EXIT
      helm template test {{.CHART_DIR}} > "${scan}/manifests.yaml"
      if command -v trivy >/dev/null 2>&1; then
        trivy config "${scan}/manifests.yaml" \
          --ignorefile {{.CHART_DIR}}/.trivyignore --severity HIGH,CRITICAL --exit-code 1
      else
        docker run --rm -v "${scan}":/scan -v "$(pwd)/{{.CHART_DIR}}":/chart \
          aquasec/trivy:{{.TRIVY_VERSION}} \
          config /scan/manifests.yaml \
          --ignorefile /chart/.trivyignore --severity HIGH,CRITICAL --exit-code 1
      fi

  trivy:report:
    desc: Trivy misconfiguration scan with a SARIF report (TRIVY_SARIF=path relative to the repository root)
    cmd: |
      set -eu
      # The Docker fallback writes the report through a mount of the
      # repository root, so a path outside it would land somewhere else than
      # the local binary writes it.
      case "{{.TRIVY_SARIF}}" in
        /*|../*|*/../*)
          echo "TRIVY_SARIF must be relative to the repository root, got '{{.TRIVY_SARIF}}'." >&2
          exit 1 ;;
      esac
      scan="$(mktemp -d "${TMPDIR:-/tmp}/chart-trivy.XXXXXX")"
      trap 'rm -rf "${scan}"' EXIT
      helm template test {{.CHART_DIR}} > "${scan}/manifests.yaml"
      if command -v trivy >/dev/null 2>&1; then
        trivy config "${scan}/manifests.yaml" \
          --ignorefile {{.CHART_DIR}}/.trivyignore \
          --severity HIGH,CRITICAL --format sarif --output {{.TRIVY_SARIF}}
      else
        docker run --rm -v "${scan}":/scan -v "$(pwd)/{{.CHART_DIR}}":/chart -v "$(pwd)":/out \
          aquasec/trivy:{{.TRIVY_VERSION}} \
          config /scan/manifests.yaml \
          --ignorefile /chart/.trivyignore \
          --severity HIGH,CRITICAL --format sarif --output /out/{{.TRIVY_SARIF}}
      fi

  docs:
    desc: Regenerate the chart README from values.yaml and README.md.gotmpl
    sources:
      - '{{.CHART_DIR}}/Chart.yaml'
      - '{{.CHART_DIR}}/values.yaml'
      - '{{.CHART_DIR}}/README.md.gotmpl'
    generates:
      - '{{.CHART_DIR}}/README.md'
    cmd: |
      if command -v helm-docs >/dev/null 2>&1; then
        helm-docs --chart-search-root={{.CHART_DIR}} --chart-to-generate={{.CHART_DIR}}
      else
        docker run --rm -v "$(pwd)":/helm-docs -u "$(id -u):$(id -g)" \
          jnorwood/helm-docs:v{{.HELM_DOCS_VERSION}} \
          --chart-search-root={{.CHART_DIR}} --chart-to-generate={{.CHART_DIR}}
      fi

  docs:check:
    desc: Fail if the chart README is out of date with values.yaml
    cmds:
      - |
        if command -v helm-docs >/dev/null 2>&1; then
          helm-docs --chart-search-root={{.CHART_DIR}} --chart-to-generate={{.CHART_DIR}} --dry-run
        else
          docker run --rm -v "$(pwd)":/helm-docs -u "$(id -u):$(id -g)" \
            jnorwood/helm-docs:v{{.HELM_DOCS_VERSION}} \
            --chart-search-root={{.CHART_DIR}} --chart-to-generate={{.CHART_DIR}} --dry-run
        fi > "${TMPDIR:-/tmp}/helm-docs-expected.md"
      - defer: rm -f "${TMPDIR:-/tmp}/helm-docs-expected.md"
      - >-
        diff -u {{.CHART_DIR}}/README.md "${TMPDIR:-/tmp}/helm-docs-expected.md"
        || (echo "Chart README.md is out of date. Run{{":"}} task helm:docs" && exit 1)

  # --- Release -------------------------------------------------------------

  package:
    desc: Package the chart into dist/ (the release pipeline overrides --version)
    cmds:
      - mkdir -p dist
      - helm package {{.CHART_DIR}} -d dist

  release:dry-run:
    desc: Everything the release job does before it talks to the registry
    cmd: |
      set -eu
      # Runs on a copy: the image annotation is appended to Chart.yaml, and the
      # worktree must not be left modified.
      work="${TMPDIR:-/tmp}/chart-release"
      rm -rf "$work" && mkdir -p "$work"
      cp -R {{.CHART_DIR}} "$work/chart"
      .github/scripts/chart-annotate-images.sh "$work/chart"
      # Never skip silently: this step exists to catch what the release job
      # would reject, so a missing validator has to fail, not pass quietly.
      if command -v ah >/dev/null 2>&1; then
        ah lint --kind helm --path "$work/chart"
      elif command -v docker >/dev/null 2>&1; then
        docker run --rm -v "$work/chart":/chart \
          artifacthub/ah:v{{.AH_VERSION}} ah lint --kind helm --path /chart
      else
        echo "Neither ah nor docker is available; the release job would run ah lint here." >&2
        exit 1
      fi
      helm package "$work/chart" --version 0.0.0-ci --destination "$work/dist"
      ls -l "$work/dist"
      rm -rf "$work"

  # --- Aggregates ----------------------------------------------------------

  lint:
    desc: All chart linters
    cmds:
      - task: lint:helm
      - task: lint:ct
      - task: lint:kube
      - task: lint:ah
      - task: lint:schema

  ci:
    desc: Full chart quality gate (what chart-ci.yml runs)
    cmds:
      - task: lint:conf:drift
      - task: lint
      - task: template
      - task: unittest
      - task: gitops-determinism
      - task: docs:check
      - task: trivy
      - task: release:dry-run
